<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="220" viewBox="0 0 1100 220">

  <defs>

    <!-- SAME REFERENCE BLUE THEME -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0F2C4C"/>
      <stop offset="25%"  stop-color="#1F5C8B"/>
      <stop offset="50%"  stop-color="#2D86C0"/>
      <stop offset="75%"  stop-color="#1F5C8B"/>
      <stop offset="100%" stop-color="#2D86C0"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D86C0"/>
      <stop offset="100%" stop-color="#0F2C4C"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1100" height="220" rx="12" fill="url(#bg)"/>


  <!-- Reference-style background bands -->
  <g opacity=".10" fill="#FFFFFF">
    <rect x="0" y="18" width="1100" height="3"/>
    <rect x="0" y="50" width="1100" height="3"/>
    <rect x="0" y="168" width="1100" height="3"/>
    <rect x="0" y="199" width="1100" height="3"/>
  </g>


  <!-- ========================================== -->
  <!-- OUTLIER HANDLING ICON -->
  <!-- ========================================== -->

  <g transform="translate(115 108)">

    <!-- Rotating analysis ring -->
    <circle r="58"
            fill="none"
            stroke="#B9E6FA"
            stroke-width="2"
            stroke-dasharray="8 8"
            opacity=".7">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>


    <!-- DATA DISTRIBUTION -->

    <g stroke="#C7ECFA"
       stroke-width="2">

      <!-- Baseline -->
      <line x1="-45"
            y1="25"
            x2="45"
            y2="25"/>

      <!-- Normal data points -->
      <circle cx="-34" cy="16" r="5" fill="#2D86C0"/>
      <circle cx="-23" cy="7"  r="5" fill="#2D86C0"/>
      <circle cx="-12" cy="18" r="5" fill="#2D86C0"/>
      <circle cx="0"   cy="10" r="5" fill="#2D86C0"/>
      <circle cx="12"  cy="17" r="5" fill="#2D86C0"/>
      <circle cx="24"  cy="8"  r="5" fill="#2D86C0"/>
      <circle cx="35"  cy="15" r="5" fill="#2D86C0"/>

      <!-- OUTLIER -->
      <circle cx="48"
              cy="-38"
              r="7"
              fill="#FFFFFF"
              filter="url(#glow)">

        <animate
          attributeName="r"
          values="6;9;6"
          dur="1.6s"
          repeatCount="indefinite"/>

      </circle>

      <!-- Connection showing outlier -->
      <line x1="35"
            y1="15"
            x2="48"
            y2="-38"
            stroke="#B9E6FA"
            stroke-dasharray="4 4"/>

    </g>


    <!-- HANDLING ARROW -->

    <path d="M48,-38
             C68,-28 68,5 45,25"

          fill="none"
          stroke="#D9F2FF"
          stroke-width="3"
          stroke-linecap="round"/>

    <path d="M39,19 L45,25 L37,28"
          fill="none"
          stroke="#D9F2FF"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>


    <!-- Replacement / corrected point -->

    <circle cx="28"
            cy="25"
            r="6"
            fill="url(#icon)"
            stroke="#FFFFFF"
            stroke-width="2">

      <animate
        attributeName="opacity"
        values=".3;1;.3"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Small data nodes -->

    <circle cx="-48" cy="-45"
            r="4"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="1.8s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="-55" cy="45"
            r="4"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ========================================== -->
  <!-- TITLE -->
  <!-- ========================================== -->

  <text x="625"
        y="88"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="50"
        font-weight="700"
        letter-spacing=".8"
        fill="url(#title)">

    Outlier Handling

  </text>


  <!-- Animated shine -->
  <rect x="400"
        y="52"
        width="80"
        height="48"
        fill="#FFFFFF"
        opacity=".12">

    <animate
      attributeName="x"
      values="400;850;400"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Divider -->
  <line x1="410"
        y1="117"
        x2="840"
        y2="117"
        stroke="#B9E6FA"
        stroke-width="2"/>


  <circle cx="402"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="848"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- SUBTITLE -->

  <text x="625"
        y="153"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="600"
        letter-spacing="1.2"
        fill="#D0EFFB">

    Detect • Treat • Stabilize

  </text>


  <!-- Bottom data flow -->

  <g transform="translate(625 184)"
     stroke="#B9E6FA"
     stroke-width="2">

    <line x1="-55"
          y1="0"
          x2="55"
          y2="0"
          opacity=".45"/>

    <circle cx="-55" cy="0" r="4" fill="#B9E6FA"/>
    <circle cx="0" cy="0" r="4" fill="#B9E6FA"/>
    <circle cx="55" cy="0" r="4" fill="#B9E6FA"/>

    <!-- Moving data point -->
    <circle cx="-55"
            cy="0"
            r="5"
            fill="#FFFFFF">

      <animate
        attributeName="cx"
        values="-55;0;55;-55"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
