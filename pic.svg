<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="260"
     viewBox="0 0 1100 260">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%"   stop-color="#050816"/>
      <stop offset="48%"  stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#160b35"/>
    </linearGradient>

    <!-- Main Accent -->
    <linearGradient id="accent"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="50%"  stop-color="#7c6cff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <!-- Violet -->
    <linearGradient id="violet"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#c56cff"/>
    </linearGradient>

    <!-- Glass -->
    <linearGradient id="glass"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <clipPath id="clip">
      <rect width="1100"
            height="260"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="1100"
        height="260"
        rx="20"
        fill="url(#bg)"/>


  <g clip-path="url(#clip)">


    <!-- Ambient Glow -->

    <circle cx="150"
            cy="120"
            r="100"
            fill="#00d9ff"
            opacity=".08"
            filter="url(#bigGlow)">

      <animate attributeName="r"
               values="80;120;80"
               dur="5s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="930"
            cy="140"
            r="110"
            fill="#8a5cff"
            opacity=".10"
            filter="url(#bigGlow)">

      <animate attributeName="cx"
               values="880;960;880"
               dur="7s"
               repeatCount="indefinite"/>

    </circle>


    <!-- ================= TECH GRID ================= -->

    <g stroke="#8090c9"
       stroke-width="1"
       opacity=".08">

      <path d="M0 40H1100"/>
      <path d="M0 80H1100"/>
      <path d="M0 120H1100"/>
      <path d="M0 160H1100"/>
      <path d="M0 200H1100"/>
      <path d="M0 240H1100"/>

      <path d="M40 0V260"/>
      <path d="M120 0V260"/>
      <path d="M200 0V260"/>
      <path d="M280 0V260"/>
      <path d="M360 0V260"/>
      <path d="M440 0V260"/>
      <path d="M520 0V260"/>
      <path d="M600 0V260"/>
      <path d="M680 0V260"/>
      <path d="M760 0V260"/>
      <path d="M840 0V260"/>
      <path d="M920 0V260"/>
      <path d="M1000 0V260"/>

    </g>


    <!-- ================= LEFT DATA ICON ================= -->

    <g transform="translate(135 130)">

      <!-- Orbit -->

      <circle r="72"
              fill="none"
              stroke="url(#accent)"
              stroke-width="1"
              stroke-dasharray="4 9"
              opacity=".55">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="15s"
          repeatCount="indefinite"/>

      </circle>


      <circle r="55"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".12"/>


      <!-- Orbiting Node -->

      <circle cx="72"
              cy="0"
              r="5"
              fill="#00eaff"
              filter="url(#glow)">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="5s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Database -->

      <ellipse cx="0"
               cy="-30"
               rx="34"
               ry="11"
               fill="url(#violet)"
               stroke="#bdf7ff"
               stroke-width="1.5"
               filter="url(#glow)"/>

      <path d="M-34-30V5
               C-34 18-18 24 0 24
               C18 24 34 18 34 5
               V-30"
            fill="url(#violet)"
            stroke="#bdf7ff"
            stroke-width="1.5"/>

      <ellipse cx="0"
               cy="-30"
               rx="34"
               ry="11"
               fill="#111a3c"
               opacity=".65"/>

      <path d="M-30-14
               C-15-5 15-5 30-14"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".35"/>


      <!-- Connection Dots -->

      <circle cx="-45"
              cy="42"
              r="4"
              fill="#00ffc8"
              filter="url(#glow)"/>

      <circle cx="45"
              cy="42"
              r="4"
              fill="#00e5ff"
              filter="url(#glow)"/>


      <!-- Connecting Lines -->

      <path d="M-45 42L-20 20"
            stroke="#00ffc8"
            stroke-width="1"
            opacity=".6"/>

      <path d="M45 42L20 20"
            stroke="#00e5ff"
            stroke-width="1"
            opacity=".6"/>

    </g>


    <!-- ================= CENTER CONTENT ================= -->

    <g transform="translate(275 0)">


      <!-- Small Label -->

      <rect x="10"
            y="27"
            width="180"
            height="28"
            rx="14"
            fill="#ffffff"
            fill-opacity=".045"
            stroke="#66eaff"
            stroke-opacity=".3"/>


      <circle cx="28"
              cy="41"
              r="4"
              fill="#00ffc8"
              filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="1.5s"
                 repeatCount="indefinite"/>

      </circle>


      <text x="42"
            y="46"
            font-family="Segoe UI,Arial"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#b9f7ff">
        DATA PIPELINE
      </text>


      <!-- Main Title -->

      <text x="12"
            y="112"
            font-family="Segoe UI,Arial,sans-serif"
            font-size="37"
            font-weight="800"
            fill="#f5fbff">

        Part B: Data Acquisition

        <animate attributeName="opacity"
                 values="0;1"
                 dur="1.2s"
                 fill="freeze"/>

      </text>


      <!-- Second Line -->

      <text x="14"
            y="154"
            font-family="Segoe UI,Arial,sans-serif"
            font-size="30"
            font-weight="700"
            fill="url(#accent)">

        &amp; Merging

        <animate attributeName="opacity"
                 values="0;1"
                 dur="1.7s"
                 fill="freeze"/>

      </text>


      <!-- Animated Underline -->

      <rect x="14"
            y="174"
            width="410"
            height="3"
            rx="2"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;410"
                 dur="1.4s"
                 fill="freeze"/>

      </rect>


      <!-- Subtitle -->

      <text x="15"
            y="205"
            font-family="Segoe UI,Arial"
            font-size="10"
            letter-spacing="2.5"
            fill="#6e9bd8">

        COLLECT  •  CONNECT  •  INTEGRATE

      </text>


      <!-- Moving Data Pulse -->

      <path d="M15 222H390"
            stroke="#263b69"
            stroke-width="1"/>

      <circle cx="15"
              cy="222"
              r="3"
              fill="#ffffff"
              filter="url(#glow)">

        <animate attributeName="cx"
                 values="15;390;15"
                 dur="3.5s"
                 repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================= RIGHT PANEL ================= -->

    <g transform="translate(790 31)">

      <rect width="275"
            height="198"
            rx="22"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#8e7aff"
            stroke-opacity=".25"/>


      <text x="22"
            y="30"
            font-family="Segoe UI,Arial"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#91b8ff">
        MERGE ENGINE
      </text>


      <!-- Source 1 -->

      <rect x="22"
            y="52"
            width="75"
            height="34"
            rx="9"
            fill="url(#glass)"
            stroke="#00e5ff"
            stroke-opacity=".35"/>

      <circle cx="36"
              cy="69"
              r="4"
              fill="#00e5ff"
              filter="url(#glow)"/>

      <text x="48"
            y="73"
            font-family="Segoe UI,Arial"
            font-size="9"
            fill="#b9f7ff">
        CSV
      </text>


      <!-- Source 2 -->

      <rect x="22"
            y="98"
            width="75"
            height="34"
            rx="9"
            fill="url(#glass)"
            stroke="#7c6cff"
            stroke-opacity=".35"/>

      <circle cx="36"
              cy="115"
              r="4"
              fill="#8d7cff"
              filter="url(#glow)"/>

      <text x="48"
            y="119"
            font-family="Segoe UI,Arial"
            font-size="9"
            fill="#c9c1ff">
        JSON
      </text>


      <!-- Source 3 -->

      <rect x="22"
            y="144"
            width="75"
            height="34"
            rx="9"
            fill="url(#glass)"
            stroke="#00ffc8"
            stroke-opacity=".35"/>

      <circle cx="36"
              cy="161"
              r="4"
              fill="#00ffc8"
              filter="url(#glow)"/>

      <text x="48"
            y="165"
            font-family="Segoe UI,Arial"
            font-size="9"
            fill="#8dffe9">
        SQL
      </text>


      <!-- Merge Lines -->

      <path d="M97 69H145
               M97 115H145
               M97 161H145"
            stroke="#526b9f"
            stroke-width="1.5"/>


      <!-- Merge Node -->

      <circle cx="165"
              cy="115"
              r="27"
              fill="url(#violet)"
              opacity=".9"
              filter="url(#glow)"/>

      <circle cx="165"
              cy="115"
              r="19"
              fill="#09132f"
              opacity=".75"/>

      <path d="M154 115L162 123L177 106"
            fill="none"
            stroke="#ffffff"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"/>


      <!-- Final Dataset -->

      <path d="M192 115H225"
            stroke="#00ffc8"
            stroke-width="2"/>

      <circle cx="230"
              cy="115"
              r="7"
              fill="#00ffc8"
              filter="url(#glow)"/>

      <text x="201"
            y="95"
            font-family="Segoe UI,Arial"
            font-size="8"
            letter-spacing="1"
            fill="#7fa7dc">
        MERGED
      </text>


      <!-- Floating Particles -->

      <circle cx="15"
              cy="184"
              r="2"
              fill="#7eeaff">

        <animate attributeName="cy"
                 values="184;165;184"
                 dur="3s"
                 repeatCount="indefinite"/>

      </circle>


      <circle cx="250"
              cy="45"
              r="2"
              fill="#8d7cff">

        <animate attributeName="cy"
                 values="45;65;45"
                 dur="4s"
                 repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================= MOVING SCANNER ================= -->

    <rect x="260"
          y="20"
          width="2"
          height="220"
          fill="url(#accent)"
          opacity=".15">

      <animate attributeName="x"
               values="250;790;250"
               dur="7s"
               repeatCount="indefinite"/>

    </rect>


    <!-- ================= BORDER ================= -->

    <rect x="1.5"
          y="1.5"
          width="1097"
          height="257"
          rx="19"
          fill="none"
          stroke="url(#accent)"
          stroke-opacity=".3"
          stroke-width="2"/>

  </g>

</svg>
