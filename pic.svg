<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".55" stop-color="#f5faff"/>
    <stop offset="1" stop-color="#e8f5ff"/>
  </linearGradient>

  <!-- BLUE -->
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08c8f3"/>
    <stop offset=".5" stop-color="#147ce5"/>
    <stop offset="1" stop-color="#173ca8"/>
  </linearGradient>

  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#123b9d"/>
    <stop offset="1" stop-color="#061b63"/>
  </linearGradient>

  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".5" stop-color="#cbd9e8"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>

  <filter id="shadow">
    <feDropShadow dx="0" dy="10" stdDeviation="12"
                  flood-color="#1756a5" flood-opacity=".18"/>
  </filter>

  <filter id="glow">
    <feGaussianBlur stdDeviation="7"/>
  </filter>

</defs>


