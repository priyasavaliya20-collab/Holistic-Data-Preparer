<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="260"
     viewBox="0 0 1100 260">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#09132f"/>
      <stop offset="100%" stop-color="#160b35"/>
    </linearGradient>

    <!-- ACCENT -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c6cff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <!-- VIOLET -->
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#665cff"/>
      <stop offset="100%" stop-color="#c56cff"/>
    </linearGradient>

    <!-- GLASS -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>

    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- GRID -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#6d82b8"
            stroke-opacity=".09"/>

      <circle cx="0"
              cy="0"
              r="1.3"
              fill="#7890c9"
              opacity=".15"/>

    </pattern>

    <clipPath id="clip">
      <rect x="2"
            y="2"
            width="1096"
            height="256"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1100"
        height="260"
        rx="20"
        fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <rect width="1100"
          height="260"
          fill="url(#grid)"/>


    <!-- AMBIENT GLOW -->

    <circle cx="145"
            cy="130"
            r="100"
            fill="#00d9ff"
            opacity=".07"
            filter="url(#softGlow)"/>

    <circle cx="950"
            cy="130"
            r="110"
            fill="#865cff"
            opacity=".07"
            filter="url(#softGlow)"/>


    <!-- ================================================= -->
    <!-- LEFT SCALING ICON -->
    <!-- ================================================= -->

    <g transform="translate(145 130)">

      <!-- Orbit -->

      <circle r="70"
              fill="none"
              stroke="#00e5ff"
              stroke-width="1"
              stroke-dasharray="4 9"
              opacity=".55">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="16s"
          repeatCount="indefinite"/>

      </circle>


      <circle r="55"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".12"/>


      <!-- Main Circle -->

      <circle r="36"
              fill="url(#violet)"
              stroke="#bdf7ff"
              stroke-width="2"
              filter="url(#glow)"/>


      <circle r="26"
              fill="#07102d"
              opacity=".85"/>


      <!-- SCALE BARS -->

      <rect x="-18"
            y="7"
            width="8"
            height="10"
            rx="2"
            fill="#00e5ff"/>

      <rect x="-5"
            y="-2"
            width="8"
            height="19"
            rx="2"
            fill="#00ffc8"/>

      <rect x="8"
            y="-14"
            width="8"
            height="31"
            rx="2"
            fill="#ffffff"/>


      <!-- Scaling Arrows -->

      <path d="M-20 -17H20"
            stroke="#00e5ff"
            stroke-width="2"
            stroke-linecap="round"/>

      <path d="M-20 -17L-14 -22"
            stroke="#00e5ff"
            stroke-width="2"
            stroke-linecap="round"/>

      <path d="M20 -17L14 -22"
            stroke="#00e5ff"
            stroke-width="2"
            stroke-linecap="round"/>


      <!-- Orbit Dot -->

      <circle cx="70"
              cy="0"
              r="5"
              fill="#00eaff"
              filter="url(#glow)">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="5s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Spark -->

      <path d="M-52 38
               L-47 48
               L-37 53
               L-47 58
               L-52 68
               L-57 58
               L-67 53
               L-57 48Z"
            fill="#00ffc8"
            filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2s"
                 repeatCount="indefinite"/>

      </path>

    </g>


    <!-- ================================================= -->
    <!-- CENTER CONTENT -->
    <!-- ================================================= -->

    <g transform="translate(285 0)">

      <!-- LABEL -->

      <rect x="10"
            y="23"
            width="190"
            height="28"
            rx="14"
            fill="#ffffff"
            fill-opacity=".04"
            stroke="#00e5ff"
            stroke-opacity=".35"/>


      <circle cx="27"
              cy="37"
              r="4"
              fill="#00ffc8"
              filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="1.5s"
                 repeatCount="indefinite"/>

      </circle>


      <text x="41"
            y="41"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#b9f7ff">

        SCALING PIPELINE

      </text>


      <!-- TITLE -->

      <text x="12"
            y="101"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="35"
            font-weight="800"
            fill="#00d9ff">

        Part F:

      </text>


      <text x="12"
            y="143"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="31"
            font-weight="800"
            fill="#f7fbff">

        Feature Scaling

      </text>


      <!-- UNDERLINE -->

      <rect x="12"
            y="157"
            width="390"
            height="3"
            rx="2"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;390"
                 dur="1.3s"
                 fill="freeze"/>

      </rect>


      <!-- SUBTITLE -->

      <text x="12"
            y="184"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            letter-spacing="2.1"
            fill="#78a7e8">

        STANDARDIZE • NORMALIZE • BALANCE

      </text>


      <!-- DATA LINE -->

      <line x1="12"
            y1="207"
            x2="390"
            y2="207"
            stroke="#30446f"/>


      <circle cx="12"
              cy="207"
              r="3.5"
              fill="#ffffff"
              filter="url(#glow)">

        <animate attributeName="cx"
                 values="12;390;12"
                 dur="3.5s"
                 repeatCount="indefinite"/>

      </circle>


      <!-- STATUS -->

      <circle cx="12"
              cy="229"
              r="3.5"
              fill="#00ffc8"
              filter="url(#glow)"/>


      <text x="24"
            y="233"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="9"
            font-weight="600"
            letter-spacing="1.5"
            fill="#67ffe5">

        FEATURES ON A COMMON SCALE

      </text>

    </g>


    <!-- ================================================= -->
    <!-- RIGHT SCALING CARD -->
    <!-- ================================================= -->

    <g transform="translate(790 24)">

      <rect width="285"
            height="212"
            rx="22"
            fill="url(#glass)"
            stroke="#8e7aff"
            stroke-opacity=".3"/>


      <!-- CARD TITLE -->

      <text x="22"
            y="31"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#91b8ff">

        SCALE TRANSFORM

      </text>


      <!-- BEFORE -->

      <text x="22"
            y="57"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#7fa7dc">

        BEFORE

      </text>


      <rect x="22"
            y="67"
            width="70"
            height="48"
            rx="8"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#00e5ff"
            stroke-opacity=".4"/>


      <!-- Unequal bars -->

      <rect x="31"
            y="101"
            width="8"
            height="8"
            rx="2"
            fill="#00e5ff"/>

      <rect x="45"
            y="91"
            width="8"
            height="18"
            rx="2"
            fill="#00ffc8"/>

      <rect x="59"
            y="77"
            width="8"
            height="32"
            rx="2"
            fill="#7c6cff"/>

      <rect x="73"
            y="71"
            width="8"
            height="38"
            rx="2"
            fill="#c56cff"/>


      <!-- ARROW -->

      <path d="M101 91H132"
            stroke="#00ffc8"
            stroke-width="2.5"
            stroke-linecap="round"/>

      <path d="M125 84L133 91L125 98"
            fill="none"
            stroke="#00ffc8"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>


      <!-- SCALE CORE -->

      <circle cx="160"
              cy="91"
              r="25"
              fill="url(#violet)"
              filter="url(#glow)"/>


      <circle cx="160"
              cy="91"
              r="17"
              fill="#09132f"/>


      <!-- Scale Icon -->

      <line x1="148"
            y1="91"
            x2="172"
            y2="91"
            stroke="#ffffff"
            stroke-width="2"/>

      <line x1="160"
            y1="80"
            x2="160"
            y2="102"
            stroke="#ffffff"
            stroke-width="2"/>

      <circle cx="150"
              cy="91"
              r="3"
              fill="#00e5ff"/>

      <circle cx="170"
              cy="91"
              r="3"
              fill="#00ffc8"/>


      <!-- AFTER -->

      <text x="198"
            y="57"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#7fa7dc">

        AFTER

      </text>


      <rect x="198"
            y="67"
            width="65"
            height="48"
            rx="8"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#00ffc8"
            stroke-opacity=".45"/>


      <!-- Equalized bars -->

      <rect x="207"
            y="84"
            width="7"
            height="25"
            rx="2"
            fill="#00e5ff"/>

      <rect x="219"
            y="80"
            width="7"
            height="29"
            rx="2"
            fill="#00ffc8"/>

      <rect x="231"
            y="83"
            width="7"
            height="26"
            rx="2"
            fill="#7c6cff"/>

      <rect x="243"
            y="81"
            width="7"
            height="28"
            rx="2"
            fill="#c56cff"/>


      <!-- QUALITY -->

      <text x="22"
            y="145"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#7fa7dc">

        SCALE CONSISTENCY

      </text>


      <rect x="22"
            y="155"
            width="240"
            height="7"
            rx="4"
            fill="#26345d"/>


      <rect x="22"
            y="155"
            width="202"
            height="7"
            rx="4"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;202"
                 dur="1.8s"
                 fill="freeze"/>

      </rect>


      <!-- METHODS -->

      <text x="22"
            y="190"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#8bb1df">

        STANDARDIZATION

      </text>


      <text x="142"
            y="190"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#8bb1df">

        NORMALIZATION

      </text>


      <!-- Floating Dot -->

      <circle cx="260"
              cy="45"
              r="2"
              fill="#7eeaff">

        <animate attributeName="cy"
                 values="45;62;45"
                 dur="3s"
                 repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================================= -->
    <!-- MOVING SCANNER -->
    <!-- ================================================= -->

    <rect x="265"
          y="10"
          width="2"
          height="240"
          fill="url(#accent)"
          opacity=".12">

      <animate attributeName="x"
               values="260;785;260"
               dur="7s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ================================================= -->
  <!-- BORDER -->
  <!-- ================================================= -->

  <rect x="1.5"
        y="1.5"
        width="1097"
        height="257"
        rx="19"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-opacity=".5"/>

</svg>
