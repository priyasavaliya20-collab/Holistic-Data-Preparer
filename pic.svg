<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="260"
     viewBox="0 0 1100 260">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#09132f"/>
      <stop offset="100%" stop-color="#160b35"/>
    </linearGradient>

    <!-- ACCENT -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c6cff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <!-- VIOLET -->
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#665cff"/>
      <stop offset="100%" stop-color="#c56cff"/>
    </linearGradient>

    <!-- GLASS -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>

    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- GRID -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#6d82b8"
            stroke-opacity=".09"/>

      <circle cx="0"
              cy="0"
              r="1.3"
              fill="#7890c9"
              opacity=".15"/>
    </pattern>

    <clipPath id="clip">
      <rect x="2"
            y="2"
            width="1096"
            height="256"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1100"
        height="260"
        rx="20"
        fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <rect width="1100"
          height="260"
          fill="url(#grid)"/>


    <!-- AMBIENT GLOW -->

    <circle cx="145"
            cy="130"
            r="100"
            fill="#00d9ff"
            opacity=".07"
            filter="url(#softGlow)"/>

    <circle cx="950"
            cy="130"
            r="110"
            fill="#865cff"
            opacity=".07"
            filter="url(#softGlow)"/>


    <!-- ================================================= -->
    <!-- LEFT TRANSFORMATION ICON -->
    <!-- ================================================= -->

    <g transform="translate(145 130)">

      <!-- Orbit -->

      <circle r="70"
              fill="none"
              stroke="#00e5ff"
              stroke-width="1"
              stroke-dasharray="4 9"
              opacity=".55">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="16s"
          repeatCount="indefinite"/>

      </circle>


      <circle r="55"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".12"/>


      <!-- Main Engine -->

      <circle r="36"
              fill="url(#violet)"
              stroke="#bdf7ff"
              stroke-width="2"
              filter="url(#glow)"/>

      <circle r="26"
              fill="#07102d"
              opacity=".85"/>


      <!-- INPUT NODES -->

      <circle cx="-16"
              cy="-13"
              r="5"
              fill="#00e5ff"/>

      <circle cx="-16"
              cy="13"
              r="5"
              fill="#00ffc8"/>


      <!-- OUTPUT NODE -->

      <circle cx="16"
              cy="0"
              r="5"
              fill="#ffffff"
              filter="url(#glow)"/>


      <!-- TRANSFORMATION CONNECTIONS -->

      <path d="M-11 -13
               H0
               L11 0

               M-11 13
               H0
               L11 0"
            fill="none"
            stroke="#9defff"
            stroke-width="2"/>


      <!-- Center Core -->

      <circle cx="0"
              cy="0"
              r="7"
              fill="#7c6cff"
              filter="url(#glow)"/>


      <!-- Orbit Dot -->

      <circle cx="70"
              cy="0"
              r="5"
              fill="#00eaff"
              filter="url(#glow)">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="5s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Spark -->

      <path d="M-52 38
               L-47 48
               L-37 53
               L-47 58
               L-52 68
               L-57 58
               L-67 53
               L-57 48Z"
            fill="#00ffc8"
            filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2s"
                 repeatCount="indefinite"/>

      </path>

    </g>


    <!-- ================================================= -->
    <!-- CENTER CONTENT -->
    <!-- ================================================= -->

    <g transform="translate(285 0)">

      <!-- LABEL -->

      <rect x="10"
            y="23"
            width="220"
            height="28"
            rx="14"
            fill="#ffffff"
            fill-opacity=".04"
            stroke="#00e5ff"
            stroke-opacity=".35"/>


      <circle cx="27"
              cy="37"
              r="4"
              fill="#00ffc8"
              filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="1.5s"
                 repeatCount="indefinite"/>

      </circle>


      <text x="41"
            y="41"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#b9f7ff">

        FEATURE TRANSFORMATION

      </text>


      <!-- TITLE -->

      <text x="12"
            y="101"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="35"
            font-weight="800"
            fill="#00d9ff">

        Part G:

      </text>


      <text x="12"
            y="143"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="27"
            font-weight="800"
            fill="#f7fbff">

        Feature Construction

      </text>


      <text x="12"
            y="174"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="27"
            font-weight="800"
            fill="#f7fbff">

        &amp; Transformation

      </text>


      <!-- UNDERLINE -->

      <rect x="12"
            y="188"
            width="390"
            height="3"
            rx="2"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;390"
                 dur="1.3s"
                 fill="freeze"/>

      </rect>


      <!-- SUBTITLE -->

      <text x="12"
            y="215"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="9"
            letter-spacing="1.8"
            fill="#78a7e8">

        CREATE • DERIVE • TRANSFORM • OPTIMIZE

      </text>


      <!-- STATUS -->

      <circle cx="12"
              cy="239"
              r="3.5"
              fill="#00ffc8"
              filter="url(#glow)"/>


      <text x="24"
            y="243"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8.5"
            font-weight="600"
            letter-spacing="1.3"
            fill="#67ffe5">

        NEW FEATURES READY

      </text>

    </g>


    <!-- ================================================= -->
    <!-- RIGHT FEATURE CONSTRUCTION CARD -->
    <!-- ================================================= -->

    <g transform="translate(790 24)">

      <rect width="285"
            height="212"
            rx="22"
            fill="url(#glass)"
            stroke="#8e7aff"
            stroke-opacity=".3"/>


      <!-- CARD TITLE -->

      <text x="22"
            y="31"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#91b8ff">

        FEATURE BUILDER

      </text>


      <!-- INPUT -->

      <text x="22"
            y="57"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#7fa7dc">

        INPUT FEATURES

      </text>


      <rect x="22"
            y="67"
            width="75"
            height="28"
            rx="7"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#00e5ff"
            stroke-opacity=".45"/>


      <text x="59"
            y="85"
            text-anchor="middle"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            fill="#00e5ff">

        X₁

      </text>


      <rect x="22"
            y="103"
            width="75"
            height="28"
            rx="7"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#7c6cff"
            stroke-opacity=".45"/>


      <text x="59"
            y="121"
            text-anchor="middle"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            fill="#b79cff">

        X₂

      </text>


      <!-- FLOW -->

      <path d="M97 81
               H123
               V94
               H139"
            fill="none"
            stroke="#00e5ff"
            stroke-width="2"
            stroke-dasharray="5 5"/>


      <path d="M97 117
               H123
               V106
               H139"
            fill="none"
            stroke="#9a7cff"
            stroke-width="2"
            stroke-dasharray="5 5"/>


      <!-- TRANSFORMATION CORE -->

      <circle cx="162"
              cy="100"
              r="30"
              fill="url(#violet)"
              filter="url(#glow)"/>


      <circle cx="162"
              cy="100"
              r="20"
              fill="#09132f"/>


      <!-- Transformation Symbol -->

      <path d="M162 82
               C151 82 146 89 146 99
               C146 110 153 117 162 117
               C171 117 178 110 178 100"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"/>


      <path d="M171 94
               L178 100
               L171 106"
            fill="none"
            stroke="#00ffc8"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"/>


      <!-- OUTPUT -->

      <path d="M192 100
               H238"
            stroke="#00ffc8"
            stroke-width="2"/>


      <circle cx="247"
              cy="100"
              r="7"
              fill="#00ffc8"
              filter="url(#glow)">

        <animate attributeName="r"
                 values="5;8;5"
                 dur="1.7s"
                 repeatCount="indefinite"/>

      </circle>


      <text x="205"
            y="83"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            letter-spacing="1"
            fill="#7fa7dc">

        NEW

      </text>


      <!-- FEATURE TYPES -->

      <text x="22"
            y="157"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#7fa7dc">

        TRANSFORMATIONS

      </text>


      <text x="22"
            y="178"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8.5"
            fill="#8deaff">

        LOG

      </text>


      <text x="62"
            y="178"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8.5"
            fill="#c5b9ff">

        SQRT

      </text>


      <text x="108"
            y="178"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8.5"
            fill="#8dffe9">

        RECIPROCAL

      </text>


      <!-- QUALITY BAR -->

      <rect x="22"
            y="191"
            width="240"
            height="6"
            rx="3"
            fill="#26345d"/>


      <rect x="22"
            y="191"
            width="205"
            height="6"
            rx="3"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;205"
                 dur="1.8s"
                 fill="freeze"/>

      </rect>


      <!-- FLOATING DOT -->

      <circle cx="260"
              cy="45"
              r="2"
              fill="#7eeaff">

        <animate attributeName="cy"
                 values="45;62;45"
                 dur="3s"
                 repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================================= -->
    <!-- MOVING SCANNER -->
    <!-- ================================================= -->

    <rect x="265"
          y="10"
          width="2"
          height="240"
          fill="url(#accent)"
          opacity=".12">

      <animate attributeName="x"
               values="260;785;260"
               dur="7s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ================================================= -->
  <!-- BORDER -->
  <!-- ================================================= -->

  <rect x="1.5"
        y="1.5"
        width="1097"
        height="257"
        rx="19"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-opacity=".5"/>

</svg>
