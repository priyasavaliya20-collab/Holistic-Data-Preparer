<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="220" viewBox="0 0 1100 220">

  <defs>

    <!-- SAME REFERENCE BLUE THEME -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0F2C4C"/>
      <stop offset="25%"  stop-color="#1F5C8B"/>
      <stop offset="50%"  stop-color="#2D86C0"/>
      <stop offset="75%"  stop-color="#1F5C8B"/>
      <stop offset="100%" stop-color="#2D86C0"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49A9D5"/>
      <stop offset="100%" stop-color="#0F2C4C"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1100" height="220" rx="12" fill="url(#bg)"/>

  <!-- SUBTLE BACKGROUND BANDS -->
  <g opacity=".10" fill="#FFFFFF">
    <rect x="0" y="18" width="1100" height="3"/>
    <rect x="0" y="50" width="1100" height="3"/>
    <rect x="0" y="168" width="1100" height="3"/>
    <rect x="0" y="199" width="1100" height="3"/>
  </g>


  <!-- ========================================= -->
  <!-- FEATURE CONSTRUCTION + TRANSFORMATION -->
  <!-- ========================================= -->

  <g transform="translate(115 108)">

    <!-- Rotating outer engineering ring -->
    <circle r="58"
            fill="none"
            stroke="#B9E6FA"
            stroke-width="2"
            stroke-dasharray="8 8"
            opacity=".7">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>


    <!-- INPUT FEATURES -->

    <g stroke="#C7ECFA"
       stroke-width="2">

      <line x1="-50" y1="-32" x2="-22" y2="-10"/>
      <line x1="-50" y1="0"   x2="-22" y2="0"/>
      <line x1="-50" y1="32"  x2="-22" y2="10"/>

      <circle cx="-52" cy="-32"
              r="7"
              fill="#2D86C0"/>

      <circle cx="-52" cy="0"
              r="7"
              fill="#2D86C0"/>

      <circle cx="-52" cy="32"
              r="7"
              fill="#2D86C0"/>

    </g>


    <!-- CENTRAL TRANSFORMATION ENGINE -->

    <g transform="translate(2 0)"
       filter="url(#glow)">

      <!-- Hexagonal engineering core -->
      <path d="M0,-34
               L29,-17
               L29,17
               L0,34
               L-29,17
               L-29,-17 Z"
            fill="url(#core)"
            stroke="#D9F2FF"
            stroke-width="2.5"/>

      <!-- Inner transformation symbol -->
      <path d="M-13,-10
               H13
               M13,-10
               L6,-17
               M13,-10
               L6,-3"

            fill="none"
            stroke="#FFFFFF"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <path d="M13,10
               H-13
               M-13,10
               L-6,3
               M-13,10
               L-6,17"

            fill="none"
            stroke="#9FE2F5"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <!-- Core pulse -->
      <circle r="4"
              fill="#FFFFFF">

        <animate
          attributeName="r"
          values="3;7;3"
          dur="1.6s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- OUTPUT FEATURES -->

    <g stroke="#D9F2FF"
       stroke-width="2">

      <line x1="32" y1="-18" x2="57" y2="-32"/>
      <line x1="32" y1="0"   x2="62" y2="0"/>
      <line x1="32" y1="18"  x2="57" y2="32"/>

      <circle cx="61" cy="-32"
              r="7"
              fill="#2D86C0"/>

      <circle cx="67" cy="0"
              r="7"
              fill="#2D86C0"/>

      <circle cx="61" cy="32"
              r="7"
              fill="#2D86C0"/>

    </g>


    <!-- Transformation particles -->

    <circle r="4"
            fill="#FFFFFF"
            filter="url(#glow)">

      <animateMotion
        path="M-52,-32 L-22,-10 L32,-18 L61,-32"
        dur="2.2s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="4"
            fill="#B9E6FA">

      <animateMotion
        path="M-52,32 L-22,10 L32,18 L61,32"
        dur="2.2s"
        begin=".7s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Floating feature symbols -->

    <g fill="#D9F2FF">

      <circle cx="-55" cy="-52" r="3">
        <animate
          attributeName="opacity"
          values=".2;1;.2"
          dur="1.7s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="55" cy="52" r="3">
        <animate
          attributeName="opacity"
          values="1;.2;1"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>

    </g>

  </g>


  <!-- ========================================= -->
  <!-- TITLE -->
  <!-- ========================================= -->

  <text x="625"
        y="88"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing=".5"
        fill="url(#title)">

    Feature Construction &amp; Transformation

  </text>


  <!-- Animated shine -->
  <rect x="350"
        y="52"
        width="85"
        height="48"
        fill="#FFFFFF"
        opacity=".12">

    <animate
      attributeName="x"
      values="350;875;350"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Divider -->

  <line x1="370"
        y1="117"
        x2="880"
        y2="117"
        stroke="#B9E6FA"
        stroke-width="2"/>


  <circle cx="362"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="888"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- SUBTITLE -->

  <text x="625"
        y="153"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="600"
        letter-spacing="1.1"
        fill="#D0EFFB">

    Create • Transform • Enhance

  </text>


  <!-- Bottom data flow -->

  <g transform="translate(625 184)"
     stroke="#B9E6FA"
     stroke-width="2">

    <line x1="-55"
          y1="0"
          x2="55"
          y2="0"
          opacity=".45"/>

    <circle cx="-55" cy="0"
            r="4"
            fill="#B9E6FA"/>

    <circle cx="0" cy="0"
            r="4"
            fill="#B9E6FA"/>

    <circle cx="55" cy="0"
            r="4"
            fill="#B9E6FA"/>


    <!-- Moving data point -->

    <circle cx="-55"
            cy="0"
            r="5"
            fill="#FFFFFF">

      <animate
        attributeName="cx"
        values="-55;0;55;-55"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
