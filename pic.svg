<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="220" viewBox="0 0 1100 220">

  <defs>

    <!-- SAME REFERENCE BLUE THEME -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0F2C4C"/>
      <stop offset="25%"  stop-color="#1F5C8B"/>
      <stop offset="50%"  stop-color="#2D86C0"/>
      <stop offset="75%"  stop-color="#1F5C8B"/>
      <stop offset="100%" stop-color="#2D86C0"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49A9D5"/>
      <stop offset="100%" stop-color="#0F2C4C"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1100" height="220" rx="12" fill="url(#bg)"/>


  <!-- Subtle background bands -->
  <g opacity=".10" fill="#FFFFFF">
    <rect x="0" y="18" width="1100" height="3"/>
    <rect x="0" y="50" width="1100" height="3"/>
    <rect x="0" y="168" width="1100" height="3"/>
    <rect x="0" y="199" width="1100" height="3"/>
  </g>


  <!-- ========================================= -->
  <!-- FEATURE ENGINEERING ICON -->
  <!-- ========================================= -->

  <g transform="translate(115 108)">

    <!-- Rotating outer ring -->
    <circle r="58"
            fill="none"
            stroke="#B9E6FA"
            stroke-width="2"
            stroke-dasharray="8 8"
            opacity=".7">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>


    <!-- INPUT FEATURE NODES -->

    <g stroke="#C7ECFA"
       stroke-width="2">

      <!-- connections -->
      <line x1="-45" y1="-32"
            x2="-10" y2="-10"/>

      <line x1="-45" y1="32"
            x2="-10" y2="10"/>

      <line x1="-45" y1="0"
            x2="-10" y2="0"/>

      <!-- nodes -->
      <circle cx="-48" cy="-32"
              r="7"
              fill="#2D86C0"/>

      <circle cx="-48" cy="0"
              r="7"
              fill="#2D86C0"/>

      <circle cx="-48" cy="32"
              r="7"
              fill="#2D86C0"/>

    </g>


    <!-- CENTRAL ENGINEERING GEAR -->

    <g transform="translate(12 0)"
       filter="url(#glow)">

      <!-- Gear body -->
      <path d="
        M0,-31
        L7,-25
        L17,-27
        L20,-17
        L29,-11
        L25,-2
        L29,7
        L20,13
        L17,24
        L7,22
        L0,31
        L-7,22
        L-17,24
        L-20,13
        L-29,7
        L-25,-2
        L-29,-11
        L-20,-17
        L-17,-27
        L-7,-25 Z"

        fill="url(#gear)"
        stroke="#D9F2FF"
        stroke-width="2"/>


      <!-- Gear center -->
      <circle cx="0"
              cy="0"
              r="12"
              fill="#0F2C4C"
              stroke="#D9F2FF"
              stroke-width="2"/>


      <!-- Rotating inner gear -->
      <circle cx="0"
              cy="0"
              r="5"
              fill="#D9F2FF">

        <animate
          attributeName="r"
          values="4;7;4"
          dur="1.5s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Gear rotation -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="6s"
        repeatCount="indefinite"/>

    </g>


    <!-- OUTPUT FEATURE NODES -->

    <g stroke="#D9F2FF"
       stroke-width="2">

      <line x1="42" y1="-18"
            x2="58" y2="-30"/>

      <line x1="42" y1="0"
            x2="63" y2="0"/>

      <line x1="42" y1="18"
            x2="58" y2="30"/>

      <circle cx="63" cy="-30"
              r="6"
              fill="#2D86C0"/>

      <circle cx="68" cy="0"
              r="6"
              fill="#2D86C0"/>

      <circle cx="63" cy="30"
              r="6"
              fill="#2D86C0"/>

    </g>


    <!-- Moving transformation particles -->

    <circle r="4"
            fill="#FFFFFF">

      <animateMotion
        path="M-48,-32 L-10,-10 L42,-18 L63,-30"
        dur="2.2s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="4"
            fill="#B9E6FA">

      <animateMotion
        path="M-48,32 L-10,10 L42,18 L63,30"
        dur="2.2s"
        begin=".8s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Small floating feature dots -->

    <circle cx="-53"
            cy="-50"
            r="3"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="1.8s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="53"
            cy="50"
            r="3"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ========================================= -->
  <!-- TITLE -->
  <!-- ========================================= -->

  <text x="625"
        y="88"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="50"
        font-weight="700"
        letter-spacing=".7"
        fill="url(#title)">

    Feature Engineering

  </text>


  <!-- Animated shine -->
  <rect x="395"
        y="52"
        width="85"
        height="48"
        fill="#FFFFFF"
        opacity=".12">

    <animate
      attributeName="x"
      values="395;850;395"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Divider -->
  <line x1="410"
        y1="117"
        x2="840"
        y2="117"
        stroke="#B9E6FA"
        stroke-width="2"/>


  <circle cx="402"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="848"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- SUBTITLE -->

  <text x="625"
        y="153"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="600"
        letter-spacing="1.2"
        fill="#D0EFFB">

    Transform • Create • Optimize

  </text>


  <!-- Bottom data flow -->

  <g transform="translate(625 184)"
     stroke="#B9E6FA"
     stroke-width="2">

    <line x1="-55"
          y1="0"
          x2="55"
          y2="0"
          opacity=".45"/>

    <circle cx="-55" cy="0"
            r="4"
            fill="#B9E6FA"/>

    <circle cx="0" cy="0"
            r="4"
            fill="#B9E6FA"/>

    <circle cx="55" cy="0"
            r="4"
            fill="#B9E6FA"/>


    <!-- Moving data point -->
    <circle cx="-55"
            cy="0"
            r="5"
            fill="#FFFFFF">

      <animate
        attributeName="cx"
        values="-55;0;55;-55"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
