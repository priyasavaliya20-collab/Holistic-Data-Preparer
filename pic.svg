<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="220" viewBox="0 0 1100 220">

  <defs>

    <!-- REFERENCE THEME -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0F2C4C"/>
      <stop offset="25%"  stop-color="#1F5C8B"/>
      <stop offset="50%"  stop-color="#2D86C0"/>
      <stop offset="75%"  stop-color="#1F5C8B"/>
      <stop offset="100%" stop-color="#2D86C0"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D86C0"/>
      <stop offset="100%" stop-color="#0F2C4C"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="shine">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity=".75"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1100" height="220" rx="12" fill="url(#bg)"/>


  <!-- SUBTLE BACKGROUND BLOCKS -->
  <g opacity=".10">
    <rect x="0" y="18" width="1100" height="3" fill="#FFFFFF"/>
    <rect x="0" y="52" width="1100" height="3" fill="#FFFFFF"/>
    <rect x="0" y="168" width="1100" height="3" fill="#FFFFFF"/>
    <rect x="0" y="198" width="1100" height="3" fill="#FFFFFF"/>
  </g>


  <!-- ================= ICON ================= -->

  <g transform="translate(115 108)">

    <!-- Rotating data ring -->
    <circle r="57"
            fill="none"
            stroke="#B9E6FA"
            stroke-width="2"
            stroke-dasharray="8 8"
            opacity=".8">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="10s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Shield -->
    <path d="M0,-36
             L31,-23
             L28,10
             C24,32 0,45 0,45
             C0,45 -24,32 -28,10
             L-31,-23 Z"

          fill="url(#shield)"
          stroke="#D9F2FF"
          stroke-width="2.5"
          filter="url(#glow)"/>


    <!-- Animated check -->
    <path d="M-15,3 L-4,14 L17,-11"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="55"
          stroke-dashoffset="55">

      <animate
        attributeName="stroke-dashoffset"
        values="55;0;0;55"
        dur="3s"
        repeatCount="indefinite"/>

    </path>


    <!-- Credit card -->
    <g transform="translate(34 28) rotate(-8)">

      <rect x="-25" y="-17"
            width="50" height="34"
            rx="5"
            fill="#0F2C4C"
            stroke="#A9DDF5"
            stroke-width="2"/>

      <rect x="-18" y="-9"
            width="19" height="5"
            rx="2"
            fill="#2D86C0"/>

      <rect x="-18" y="4"
            width="29" height="3"
            rx="1.5"
            fill="#8CC9E8"/>

    </g>


    <!-- Data nodes -->
    <g fill="#C7ECFA"
       stroke="#C7ECFA"
       stroke-width="2">

      <line x1="-47" y1="-47" x2="-26" y2="-27"/>
      <line x1="47" y1="-47" x2="26" y2="-27"/>
      <line x1="-48" y1="48" x2="-26" y2="28"/>
      <line x1="48" y1="48" x2="26" y2="28"/>

      <circle cx="-50" cy="-50" r="5"/>
      <circle cx="50" cy="-50" r="5"/>
      <circle cx="-51" cy="51" r="5"/>
      <circle cx="51" cy="51" r="5"/>

      <animate
        attributeName="opacity"
        values=".3;1;.3"
        dur="2s"
        repeatCount="indefinite"/>

    </g>

  </g>


  <!-- ================= TITLE ================= -->

  <text x="625"
        y="88"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing=".5"
        fill="url(#title)">

    Customer Credit Risk

  </text>


  <!-- Moving shine -->
  <rect x="390"
        y="52"
        width="80"
        height="48"
        fill="url(#shine)"
        opacity=".25">

    <animate
      attributeName="x"
      values="390;850;390"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Divider -->
  <line x1="390" y1="117"
        x2="860" y2="117"
        stroke="#B9E6FA"
        stroke-width="2"/>


  <circle cx="382" cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>

  <circle cx="868" cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- SUBTITLE -->
  <text x="625"
        y="153"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="26"
        font-weight="600"
        letter-spacing="1.2"
        fill="#D0EFFB">

    Holistic Data Preparer

  </text>


  <!-- DATA FLOW -->
  <g transform="translate(625 184)"
     stroke="#B9E6FA"
     stroke-width="2">

    <line x1="-55" y1="0"
          x2="55" y2="0"
          opacity=".5"/>

    <circle cx="-55" cy="0" r="4" fill="#B9E6FA"/>
    <circle cx="0" cy="0" r="4" fill="#B9E6FA"/>
    <circle cx="55" cy="0" r="4" fill="#B9E6FA"/>

    <!-- Moving data point -->
    <circle cx="-55" cy="0"
            r="5"
            fill="#FFFFFF">

      <animate
        attributeName="cx"
        values="-55;0;55;-55"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
