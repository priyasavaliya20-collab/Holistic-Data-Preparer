<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="220" viewBox="0 0 1100 220">

  <defs>

    <!-- SAME REFERENCE BLUE THEME -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0F2C4C"/>
      <stop offset="25%"  stop-color="#1F5C8B"/>
      <stop offset="50%"  stop-color="#2D86C0"/>
      <stop offset="75%"  stop-color="#1F5C8B"/>
      <stop offset="100%" stop-color="#2D86C0"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1100" height="220" rx="12" fill="url(#bg)"/>

  <!-- SUBTLE BACKGROUND BANDS -->
  <g opacity=".10" fill="#FFFFFF">
    <rect x="0" y="18" width="1100" height="3"/>
    <rect x="0" y="50" width="1100" height="3"/>
    <rect x="0" y="168" width="1100" height="3"/>
    <rect x="0" y="199" width="1100" height="3"/>
  </g>


  <!-- ========================================= -->
  <!-- FEATURE SCALING ICON -->
  <!-- ========================================= -->

  <g transform="translate(115 108)">

    <!-- Rotating ring -->
    <circle r="58"
            fill="none"
            stroke="#B9E6FA"
            stroke-width="2"
            stroke-dasharray="8 8"
            opacity=".7">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>


    <!-- SCALE AXIS -->

    <line x1="-48"
          y1="32"
          x2="48"
          y2="32"
          stroke="#D9F2FF"
          stroke-width="3"/>

    <line x1="-48"
          y1="32"
          x2="-48"
          y2="-38"
          stroke="#D9F2FF"
          stroke-width="3"/>


    <!-- BEFORE BARS -->

    <g fill="#2D86C0"
       stroke="#C7ECFA"
       stroke-width="2">

      <rect x="-38" y="4"
            width="10"
            height="28"
            rx="2"/>

      <rect x="-23" y="-8"
            width="10"
            height="40"
            rx="2"/>

      <rect x="-8" y="-27"
            width="10"
            height="59"
            rx="2"/>

    </g>


    <!-- Scaling Arrow -->

    <path d="M5,-40
             C22,-35 36,-20 43,-5"

          fill="none"
          stroke="#D9F2FF"
          stroke-width="3"
          stroke-linecap="round"
          stroke-dasharray="6 5"/>

    <path d="M35,-7 L43,-5 L40,-14"
          fill="none"
          stroke="#D9F2FF"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>


    <!-- AFTER NORMALIZED POINTS -->

    <g fill="#FFFFFF"
       stroke="#B9E6FA"
       stroke-width="2">

      <circle cx="23" cy="22" r="5"/>
      <circle cx="34" cy="15" r="5"/>
      <circle cx="45" cy="8" r="5"/>

    </g>


    <!-- Animated scale line -->

    <line x1="17"
          y1="25"
          x2="48"
          y2="5"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-dasharray="4 4">

      <animate
        attributeName="opacity"
        values=".3;1;.3"
        dur="1.8s"
        repeatCount="indefinite"/>

    </line>


    <!-- Moving normalization particle -->

    <circle cx="17"
            cy="25"
            r="4"
            fill="#FFFFFF"
            filter="url(#glow)">

      <animateMotion
        path="M0,0 L31,-20"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Small data nodes -->

    <circle cx="-52"
            cy="-48"
            r="4"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="1.7s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="53"
            cy="48"
            r="4"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ========================================= -->
  <!-- TITLE -->
  <!-- ========================================= -->

  <text x="625"
        y="88"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="50"
        font-weight="700"
        letter-spacing=".7"
        fill="url(#title)">

    Feature Scaling

  </text>


  <!-- Animated shine -->

  <rect x="405"
        y="52"
        width="80"
        height="48"
        fill="#FFFFFF"
        opacity=".12">

    <animate
      attributeName="x"
      values="405;845;405"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Divider -->

  <line x1="410"
        y1="117"
        x2="840"
        y2="117"
        stroke="#B9E6FA"
        stroke-width="2"/>


  <circle cx="402"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="848"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- SUBTITLE -->

  <text x="625"
        y="153"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="600"
        letter-spacing="1.2"
        fill="#D0EFFB">

    Normalize • Standardize • Balance

  </text>


  <!-- Bottom data flow -->

  <g transform="translate(625 184)"
     stroke="#B9E6FA"
     stroke-width="2">

    <line x1="-55"
          y1="0"
          x2="55"
          y2="0"
          opacity=".45"/>

    <circle cx="-55" cy="0" r="4" fill="#B9E6FA"/>
    <circle cx="0" cy="0" r="4" fill="#B9E6FA"/>
    <circle cx="55" cy="0" r="4" fill="#B9E6FA"/>

    <circle cx="-55"
            cy="0"
            r="5"
            fill="#FFFFFF">

      <animate
        attributeName="cx"
        values="-55;0;55;-55"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
