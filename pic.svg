<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="260"
     viewBox="0 0 1100 260">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="48%" stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#160b35"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c6cff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#c56cff"/>
    </linearGradient>

    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4ecd"/>
      <stop offset="50%" stop-color="#ff6b8a"/>
      <stop offset="100%" stop-color="#ffb86c"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <clipPath id="clip">
      <rect width="1100" height="260" rx="20"/>
    </clipPath>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1100"
        height="260"
        rx="20"
        fill="url(#bg)"/>


  <g clip-path="url(#clip)">


    <!-- AMBIENT GLOW -->

    <circle cx="150" cy="125" r="105"
            fill="#00d9ff"
            opacity=".08"
            filter="url(#bigGlow)">

      <animate attributeName="r"
               values="80;120;80"
               dur="5s"
               repeatCount="indefinite"/>

    </circle>


    <circle cx="940" cy="135" r="115"
            fill="#ff4ecd"
            opacity=".07"
            filter="url(#bigGlow)">

      <animate attributeName="cx"
               values="890;970;890"
               dur="7s"
               repeatCount="indefinite"/>

    </circle>


    <!-- TECH GRID -->

    <g stroke="#8090c9"
       stroke-width="1"
       opacity=".08">

      <path d="M0 40H1100"/>
      <path d="M0 80H1100"/>
      <path d="M0 120H1100"/>
      <path d="M0 160H1100"/>
      <path d="M0 200H1100"/>
      <path d="M0 240H1100"/>

      <path d="M40 0V260"/>
      <path d="M120 0V260"/>
      <path d="M200 0V260"/>
      <path d="M280 0V260"/>
      <path d="M360 0V260"/>
      <path d="M440 0V260"/>
      <path d="M520 0V260"/>
      <path d="M600 0V260"/>
      <path d="M680 0V260"/>
      <path d="M760 0V260"/>
      <path d="M840 0V260"/>
      <path d="M920 0V260"/>
      <path d="M1000 0V260"/>

    </g>


    <!-- LEFT OUTLIER DETECTION ICON -->

    <g transform="translate(135 130)">

      <!-- Orbit -->

      <circle r="73"
              fill="none"
              stroke="url(#accent)"
              stroke-width="1"
              stroke-dasharray="4 9"
              opacity=".55">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="15s"
          repeatCount="indefinite"/>

      </circle>


      <circle r="57"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".12"/>


      <!-- Main Analytics Circle -->

      <circle cx="0"
              cy="0"
              r="38"
              fill="url(#violet)"
              stroke="#bdf7ff"
              stroke-width="2"
              filter="url(#glow)"/>


      <circle cx="0"
              cy="0"
              r="27"
              fill="#07102d"
              opacity=".78"/>


      <!-- Scatter Points -->

      <circle cx="-14" cy="-8" r="3"
              fill="#00ffc8"/>

      <circle cx="-5" cy="8" r="3"
              fill="#00e5ff"/>

      <circle cx="9" cy="-5" r="3"
              fill="#ffffff"/>

      <circle cx="14" cy="10" r="3"
              fill="#00ffc8"/>


      <!-- OUTLIER POINT -->

      <circle cx="28"
              cy="-27"
              r="6"
              fill="url(#danger)"
              filter="url(#glow)">

        <animate attributeName="r"
                 values="4;7;4"
                 dur="1.5s"
                 repeatCount="indefinite"/>

      </circle>


      <!-- Detection Line -->

      <path d="M18 -18L28 -27"
            stroke="#ff6b8a"
            stroke-width="2"
            stroke-dasharray="3 3"/>


      <!-- Orbiting Dot -->

      <circle cx="73"
              cy="0"
              r="5"
              fill="#00eaff"
              filter="url(#glow)">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="5s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Alert Spark -->

      <path d="M-55 35
               L-50 45
               L-40 50
               L-50 55
               L-55 65
               L-60 55
               L-70 50
               L-60 45Z"
            fill="#ff6b8a"
            filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2s"
                 repeatCount="indefinite"/>

      </path>

    </g>


    <!-- CENTER CONTENT -->

    <g transform="translate(275 0)">


      <!-- LABEL -->

      <rect x="10"
            y="27"
            width="205"
            height="28"
            rx="14"
            fill="#ffffff"
            fill-opacity=".045"
            stroke="#66eaff"
            stroke-opacity=".3"/>


      <circle cx="28"
              cy="41"
              r="4"
              fill="#ff6b8a"
              filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="1.2s"
                 repeatCount="indefinite"/>

      </circle>


      <text x="42"
            y="46"
            font-family="Segoe UI,Arial"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#b9f7ff">
        DATA QUALITY
      </text>


      <!-- MAIN TITLE -->

      <text x="12"
            y="112"
            font-family="Segoe UI,Arial,sans-serif"
            font-size="42"
            font-weight="800"
            fill="#f5fbff">

        Part D: Outlier Handling

        <animate attributeName="opacity"
                 values="0;1"
                 dur="1.2s"
                 fill="freeze"/>

      </text>


      <!-- UNDERLINE -->

      <rect x="14"
            y="127"
            width="405"
            height="3"
            rx="2"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;405"
                 dur="1.3s"
                 fill="freeze"/>

      </rect>


      <!-- SUBTITLE -->

      <text x="15"
            y="165"
            font-family="Segoe UI,Arial"
            font-size="10"
            letter-spacing="2.5"
            fill="#6e9bd8">

        DETECT  •  ANALYZE  •  TREAT  •  VALIDATE

      </text>


      <!-- DATA STREAM -->

      <path d="M15 190H410"
            stroke="#263b69"
            stroke-width="1"/>


      <circle cx="15"
              cy="190"
              r="3"
              fill="#ffffff"
              filter="url(#glow)">

        <animate attributeName="cx"
                 values="15;410;15"
                 dur="3.5s"
                 repeatCount="indefinite"/>

      </circle>


      <!-- STATUS -->

      <circle cx="15"
              cy="215"
              r="3"
              fill="#00ffc8"
              filter="url(#glow)"/>

      <text x="27"
            y="219"
            font-family="Segoe UI,Arial"
            font-size="9"
            letter-spacing="1.5"
            fill="#8dffe9">
        ANOMALIES UNDER CONTROL
      </text>

    </g>


    <!-- RIGHT OUTLIER ANALYTICS PANEL -->

    <g transform="translate(790 31)">

      <rect width="275"
            height="198"
            rx="22"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#ff6b8a"
            stroke-opacity=".25"/>


      <text x="22"
            y="30"
            font-family="Segoe UI,Arial"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#91b8ff">
        OUTLIER ANALYTICS
      </text>


      <!-- Box Plot -->

      <line x1="35"
            y1="100"
            x2="220"
            y2="100"
            stroke="#33466f"
            stroke-width="2"/>


      <line x1="55"
            y1="80"
            x2="55"
            y2="120"
            stroke="#7fa7dc"
            stroke-width="2"/>


      <rect x="75"
            y="78"
            width="90"
            height="44"
            rx="6"
            fill="url(#glass)"
            stroke="#7c6cff"
            stroke-width="1.5"/>


      <line x1="120"
            y1="78"
            x2="120"
            y2="122"
            stroke="#00ffc8"
            stroke-width="3"/>


      <line x1="165"
            y1="80"
            x2="165"
            y2="120"
            stroke="#7fa7dc"
            stroke-width="2"/>


      <!-- Whiskers -->

      <line x1="55"
            y1="100"
            x2="75"
            y2="100"
            stroke="#7fa7dc"
            stroke-width="2"/>

      <line x1="165"
            y1="100"
            x2="195"
            y2="100"
            stroke="#7fa7dc"
            stroke-width="2"/>


      <!-- Outlier -->

      <circle cx="218"
              cy="100"
              r="6"
              fill="url(#danger)"
              filter="url(#glow)">

        <animate attributeName="r"
                 values="4;7;4"
                 dur="1.4s"
                 repeatCount="indefinite"/>

      </circle>


      <!-- Labels -->

      <text x="22"
            y="150"
            font-family="Segoe UI,Arial"
            font-size="8"
            fill="#7fa7dc">
        NORMAL RANGE
      </text>

      <text x="185"
            y="150"
            font-family="Segoe UI,Arial"
            font-size="8"
            fill="#ff9aaa">
        OUTLIER
      </text>


      <!-- Status Bars -->

      <rect x="22"
            y="166"
            width="190"
            height="5"
            rx="3"
            fill="#26345d"/>


      <rect x="22"
            y="166"
            width="145"
            height="5"
            rx="3"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;145"
                 dur="1.7s"
                 fill="freeze"/>

      </rect>


      <!-- Floating Particles -->

      <circle cx="245"
              cy="45"
              r="2"
              fill="#7eeaff">

        <animate attributeName="cy"
                 values="45;65;45"
                 dur="3s"
                 repeatCount="indefinite"/>

      </circle>


      <circle cx="15"
              cy="180"
              r="2"
              fill="#ff6b8a">

        <animate attributeName="cy"
                 values="180;160;180"
                 dur="4s"
                 repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- MOVING SCANNER -->

    <rect x="260"
          y="20"
          width="2"
          height="220"
          fill="url(#accent)"
          opacity=".15">

      <animate attributeName="x"
               values="250;790;250"
               dur="7s"
               repeatCount="indefinite"/>

    </rect>


    <!-- BORDER -->

    <rect x="1.5"
          y="1.5"
          width="1097"
          height="257"
          rx="19"
          fill="none"
          stroke="url(#accent)"
          stroke-opacity=".3"
          stroke-width="2"/>

  </g>

</svg>
