<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="260"
     viewBox="0 0 1100 260">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="48%" stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#160b35"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c6cff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#c56cff"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <clipPath id="clip">
      <rect width="1100" height="260" rx="20"/>
    </clipPath>

  </defs>

  <!-- BACKGROUND -->
  <rect width="1100" height="260" rx="20" fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <!-- AMBIENT GLOW -->
    <circle cx="145" cy="125" r="105"
            fill="#00d9ff"
            opacity=".08"
            filter="url(#bigGlow)">
      <animate attributeName="r"
               values="80;120;80"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="945" cy="135" r="110"
            fill="#8a5cff"
            opacity=".10"
            filter="url(#bigGlow)">
      <animate attributeName="cx"
               values="890;970;890"
               dur="7s"
               repeatCount="indefinite"/>
    </circle>

    <!-- TECH GRID -->
    <g stroke="#8090c9" stroke-width="1" opacity=".08">
      <path d="M0 40H1100"/>
      <path d="M0 80H1100"/>
      <path d="M0 120H1100"/>
      <path d="M0 160H1100"/>
      <path d="M0 200H1100"/>
      <path d="M0 240H1100"/>

      <path d="M40 0V260"/>
      <path d="M120 0V260"/>
      <path d="M200 0V260"/>
      <path d="M280 0V260"/>
      <path d="M360 0V260"/>
      <path d="M440 0V260"/>
      <path d="M520 0V260"/>
      <path d="M600 0V260"/>
      <path d="M680 0V260"/>
      <path d="M760 0V260"/>
      <path d="M840 0V260"/>
      <path d="M920 0V260"/>
      <path d="M1000 0V260"/>
    </g>


    <!-- LEFT ANALYSIS ICON -->
    <g transform="translate(135 130)">

      <!-- Orbit -->
      <circle r="73"
              fill="none"
              stroke="url(#accent)"
              stroke-width="1"
              stroke-dasharray="4 9"
              opacity=".55">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="15s"
          repeatCount="indefinite"/>
      </circle>

      <circle r="57"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".12"/>

      <!-- Orbiting Dot -->
      <circle cx="73" cy="0" r="5"
              fill="#00eaff"
              filter="url(#glow)">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="5s"
          repeatCount="indefinite"/>
      </circle>

      <!-- Magnifying Glass -->
      <circle cx="-8"
              cy="-8"
              r="31"
              fill="url(#violet)"
              stroke="#bdf7ff"
              stroke-width="2"
              filter="url(#glow)"/>

      <circle cx="-8"
              cy="-8"
              r="19"
              fill="#07102d"
              opacity=".72"/>

      <path d="M13 14L35 36"
            stroke="#ffffff"
            stroke-width="8"
            stroke-linecap="round"/>

      <!-- Data Dots -->
      <circle cx="-20" cy="-14" r="3" fill="#00ffc8"/>
      <circle cx="-3" cy="-20" r="3" fill="#00e5ff"/>
      <circle cx="5" cy="-3" r="3" fill="#ffffff"/>

      <!-- Cleaning Spark -->
      <path d="M-48 35L-43 45L-33 50L-43 55L-48 65L-53 55L-63 50L-53 45Z"
            fill="#00ffc8"
            filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2s"
                 repeatCount="indefinite"/>
      </path>

    </g>


    <!-- CENTER CONTENT -->
    <g transform="translate(275 0)">

      <!-- Label -->
      <rect x="10" y="27"
            width="210"
            height="28"
            rx="14"
            fill="#ffffff"
            fill-opacity=".045"
            stroke="#66eaff"
            stroke-opacity=".3"/>

      <circle cx="28" cy="41" r="4"
              fill="#00ffc8"
              filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="1.5s"
                 repeatCount="indefinite"/>
      </circle>

      <text x="42" y="46"
            font-family="Segoe UI,Arial"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#b9f7ff">
        DATA QUALITY
      </text>


      <!-- MAIN TITLE -->
      <text x="12" y="108"
            font-family="Segoe UI,Arial,sans-serif"
            font-size="36"
            font-weight="800"
            fill="#f5fbff">

        Part C: Data Understanding

        <animate attributeName="opacity"
                 values="0;1"
                 dur="1.2s"
                 fill="freeze"/>
      </text>


      <!-- SECOND LINE -->
      <text x="14" y="150"
            font-family="Segoe UI,Arial,sans-serif"
            font-size="31"
            font-weight="700"
            fill="url(#accent)">

        &amp; Cleaning

        <animate attributeName="opacity"
                 values="0;1"
                 dur="1.6s"
                 fill="freeze"/>
      </text>


      <!-- UNDERLINE -->
      <rect x="14" y="171"
            width="390"
            height="3"
            rx="2"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;390"
                 dur="1.3s"
                 fill="freeze"/>
      </rect>


      <!-- SUBTITLE -->
      <text x="15" y="202"
            font-family="Segoe UI,Arial"
            font-size="10"
            letter-spacing="2.5"
            fill="#6e9bd8">

        INSPECT  •  DETECT  •  CLEAN  •  VALIDATE
      </text>


      <!-- DATA PULSE -->
      <path d="M15 220H390"
            stroke="#263b69"
            stroke-width="1"/>

      <circle cx="15" cy="220" r="3"
              fill="#ffffff"
              filter="url(#glow)">

        <animate attributeName="cx"
                 values="15;390;15"
                 dur="3.5s"
                 repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- RIGHT DATA QUALITY PANEL -->
    <g transform="translate(790 31)">

      <rect width="275"
            height="198"
            rx="22"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#8e7aff"
            stroke-opacity=".25"/>


      <text x="22" y="30"
            font-family="Segoe UI,Arial"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#91b8ff">
        DATA QUALITY CHECK
      </text>


      <!-- Missing Values -->
      <text x="22" y="62"
            font-family="Segoe UI,Arial"
            font-size="8"
            fill="#7fa7dc">
        MISSING VALUES
      </text>

      <rect x="22" y="70"
            width="108"
            height="6"
            rx="3"
            fill="#26345d"/>

      <rect x="22" y="70"
            width="25"
            height="6"
            rx="3"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;25"
                 dur="1.4s"
                 fill="freeze"/>
      </rect>

      <circle cx="143" cy="73" r="4"
              fill="#00ffc8"
              filter="url(#glow)"/>

      <text x="154" y="76"
            font-family="Segoe UI,Arial"
            font-size="8"
            fill="#8dffe9">
        CHECKED
      </text>


      <!-- Duplicates -->
      <text x="22" y="105"
            font-family="Segoe UI,Arial"
            font-size="8"
            fill="#7fa7dc">
        DUPLICATES
      </text>

      <rect x="22" y="113"
            width="108"
            height="6"
            rx="3"
            fill="#26345d"/>

      <rect x="22" y="113"
            width="52"
            height="6"
            rx="3"
            fill="url(#violet)">

        <animate attributeName="width"
                 values="0;52"
                 dur="1.7s"
                 fill="freeze"/>
      </rect>

      <circle cx="143" cy="116" r="4"
              fill="#7c6cff"
              filter="url(#glow)"/>

      <text x="154" y="119"
            font-family="Segoe UI,Arial"
            font-size="8"
            fill="#c9c1ff">
        REVIEWED
      </text>


      <!-- DATA TYPES -->
      <text x="22" y="148"
            font-family="Segoe UI,Arial"
            font-size="8"
            fill="#7fa7dc">
        DATA TYPES
      </text>

      <rect x="22" y="156"
            width="108"
            height="6"
            rx="3"
            fill="#26345d"/>

      <rect x="22" y="156"
            width="88"
            height="6"
            rx="3"
            fill="#00ffc8">

        <animate attributeName="width"
                 values="0;88"
                 dur="1.9s"
                 fill="freeze"/>
      </rect>

      <circle cx="143" cy="159" r="4"
              fill="#00e5ff"
              filter="url(#glow)"/>

      <text x="154" y="162"
            font-family="Segoe UI,Arial"
            font-size="8"
            fill="#8deaff">
        VALID
      </text>


      <!-- Floating Particles -->
      <circle cx="245" cy="42" r="2"
              fill="#7eeaff">
        <animate attributeName="cy"
                 values="42;62;42"
                 dur="3s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="15" cy="180" r="2"
              fill="#8d7cff">
        <animate attributeName="cy"
                 values="180;160;180"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- MOVING SCANNER -->
    <rect x="260" y="20"
          width="2"
          height="220"
          fill="url(#accent)"
          opacity=".15">

      <animate attributeName="x"
               values="250;790;250"
               dur="7s"
               repeatCount="indefinite"/>
    </rect>


    <!-- BORDER -->
    <rect x="1.5" y="1.5"
          width="1097"
          height="257"
          rx="19"
          fill="none"
          stroke="url(#accent)"
          stroke-opacity=".3"
          stroke-width="2"/>

  </g>

</svg>
