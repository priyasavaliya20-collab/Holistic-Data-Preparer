<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">

<defs>

  <!-- Premium Blue Background -->
  <linearGradient id="BG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071D35"/>
    <stop offset=".45" stop-color="#123F63"/>
    <stop offset="1" stop-color="#287FAE"/>
  </linearGradient>

  <!-- Glass Cards -->
  <linearGradient id="CARD" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#163F61"/>
    <stop offset=".5" stop-color="#205F87"/>
    <stop offset="1" stop-color="#277BA5"/>
  </linearGradient>

  <linearGradient id="ACCENT" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#70DDF7"/>
    <stop offset=".5" stop-color="#B5F3FF"/>
    <stop offset="1" stop-color="#63CFEF"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="GLOW" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>

  <filter id="CARDGLOW" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>

  <!-- Arrow -->
  <marker id="ARROW"
          markerWidth="11"
          markerHeight="11"
          refX="9"
          refY="5.5"
          orient="auto">
    <path d="M0,0 L11,5.5 L0,11 Z" fill="#8BE7FA"/>
  </marker>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect width="1500" height="760" rx="28" fill="url(#BG)"/>

<!-- Decorative light -->
<circle cx="70" cy="70" r="180" fill="#4CCCF2" opacity=".035"/>
<circle cx="1450" cy="700" r="240" fill="#65DDF7" opacity=".035"/>
<circle cx="750" cy="380" r="300" fill="#FFFFFF" opacity=".012"/>


<!-- ===================================================== -->
<!-- HEADER -->
<!-- ===================================================== -->

<text x="750"
      y="52"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="30"
      font-weight="700"
      letter-spacing="1.5"
      fill="#FFFFFF">

DATA PREPARATION WORKFLOW

</text>

<text x="750"
      y="78"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="12"
      font-weight="600"
      letter-spacing="3"
      fill="#8FE8FA">

CUSTOMER CREDIT RISK • HOLISTIC DATA PREPARER

</text>


<!-- ===================================================== -->
<!-- CONNECTION LINES -->
<!-- ===================================================== -->

<g fill="none"
   stroke="#75D9F1"
   stroke-width="2.5"
   stroke-linecap="round"
   marker-end="url(#ARROW)">

  <!-- 01 → 02 -->
  <path d="M300 205 H370"/>

  <!-- 02 → 03 -->
  <path d="M650 205 H720"/>

  <!-- 03 → 04 -->
  <path d="M1000 205 H1070"/>

  <!-- 04 → LOWER ROW -->
  <path d="
    M1210 275
    C1210 315 1345 320 1345 365
    C1345 405 1280 430 1210 430
    H290
    C250 430 230 450 230 475
  "/>

  <!-- 05 → 06 -->
  <path d="M300 555 H370"/>

  <!-- 06 → 07 -->
  <path d="M650 555 H720"/>

  <!-- 07 → 08 -->
  <path d="M1000 555 H1070"/>

</g>


<!-- ===================================================== -->
<!-- MOVING DOTS -->
<!-- ===================================================== -->

<g fill="#E7FBFF">

  <!-- 01 -->
  <circle r="5">
    <animateMotion path="M300 205 H370"
                   dur="1.2s"
                   repeatCount="indefinite"/>
    <animate attributeName="r"
             values="4;7;4"
             dur=".7s"
             repeatCount="indefinite"/>
  </circle>

  <!-- 02 -->
  <circle r="5">
    <animateMotion path="M650 205 H720"
                   dur="1.2s"
                   begin=".2s"
                   repeatCount="indefinite"/>
    <animate attributeName="r"
             values="4;7;4"
             dur=".7s"
             repeatCount="indefinite"/>
  </circle>

  <!-- 03 -->
  <circle r="5">
    <animateMotion path="M1000 205 H1070"
                   dur="1.2s"
                   begin=".4s"
                   repeatCount="indefinite"/>
    <animate attributeName="r"
             values="4;7;4"
             dur=".7s"
             repeatCount="indefinite"/>
  </circle>

  <!-- RIGHT SIDE → LOWER ROW -->
  <circle r="5">
    <animateMotion
      path="
      M1210 275
      C1210 315 1345 320 1345 365
      C1345 405 1280 430 1210 430
      H290
      C250 430 230 450 230 475
      "
      dur="4.2s"
      begin=".5s"
      repeatCount="indefinite"/>
    <animate attributeName="r"
             values="4;8;4"
             dur=".9s"
             repeatCount="indefinite"/>
  </circle>

  <!-- 05 -->
  <circle r="5">
    <animateMotion path="M300 555 H370"
                   dur="1.2s"
                   begin=".3s"
                   repeatCount="indefinite"/>
    <animate attributeName="r"
             values="4;7;4"
             dur=".7s"
             repeatCount="indefinite"/>
  </circle>

  <!-- 06 -->
  <circle r="5">
    <animateMotion path="M650 555 H720"
                   dur="1.2s"
                   begin=".5s"
                   repeatCount="indefinite"/>
    <animate attributeName="r"
             values="4;7;4"
             dur=".7s"
             repeatCount="indefinite"/>
  </circle>

  <!-- 07 -->
  <circle r="5">
    <animateMotion path="M1000 555 H1070"
                   dur="1.2s"
                   begin=".7s"
                   repeatCount="indefinite"/>
    <animate attributeName="r"
             values="4;8;4"
             dur=".7s"
             repeatCount="indefinite"/>
  </circle>

</g>


<!-- ===================================================== -->
<!-- MOVING DOT GLOW -->
<!-- ===================================================== -->

<g fill="#75E5FF"
   opacity=".45"
   filter="url(#GLOW)">

  <circle r="10">
    <animateMotion path="M300 205 H370"
                   dur="1.2s"
                   repeatCount="indefinite"/>
  </circle>

  <circle r="10">
    <animateMotion path="M650 205 H720"
