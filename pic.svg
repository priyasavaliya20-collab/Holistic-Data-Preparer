<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="220" viewBox="0 0 1100 220">

  <defs>

    <!-- SAME REFERENCE BLUE THEME -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0F2C4C"/>
      <stop offset="25%"  stop-color="#1F5C8B"/>
      <stop offset="50%"  stop-color="#2D86C0"/>
      <stop offset="75%"  stop-color="#1F5C8B"/>
      <stop offset="100%" stop-color="#2D86C0"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="document" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49A9D5"/>
      <stop offset="100%" stop-color="#0F2C4C"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1100" height="220" rx="12" fill="url(#bg)"/>


  <!-- SUBTLE BACKGROUND BANDS -->
  <g opacity=".10" fill="#FFFFFF">
    <rect x="0" y="18" width="1100" height="3"/>
    <rect x="0" y="50" width="1100" height="3"/>
    <rect x="0" y="168" width="1100" height="3"/>
    <rect x="0" y="199" width="1100" height="3"/>
  </g>


  <!-- ========================================= -->
  <!-- FINAL DELIVERABLE ICON -->
  <!-- ========================================= -->

  <g transform="translate(115 108)">

    <!-- Rotating completion ring -->
    <circle r="58"
            fill="none"
            stroke="#B9E6FA"
            stroke-width="2"
            stroke-dasharray="8 8"
            opacity=".7">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>


    <!-- DOCUMENT -->

    <g filter="url(#glow)">

      <!-- Document body -->
      <path d="M-30,-42
               H10
               L30,-22
               V42
               H-30
               Z"

            fill="url(#document)"
            stroke="#D9F2FF"
            stroke-width="2.5"/>


      <!-- Fold -->
      <path d="M10,-42
               V-22
               H30"

            fill="none"
            stroke="#D9F2FF"
            stroke-width="2.5"/>


      <!-- Document lines -->

      <line x1="-17" y1="-8"
            x2="13" y2="-8"
            stroke="#C7ECFA"
            stroke-width="4"
            stroke-linecap="round"/>

      <line x1="-17" y1="4"
            x2="15" y2="4"
            stroke="#C7ECFA"
            stroke-width="4"
            stroke-linecap="round"/>

      <line x1="-17" y1="16"
            x2="5" y2="16"
            stroke="#C7ECFA"
            stroke-width="4"
            stroke-linecap="round"/>

    </g>


    <!-- FINAL CHECK BADGE -->

    <circle cx="28"
            cy="30"
            r="18"
            fill="#2D86C0"
            stroke="#FFFFFF"
            stroke-width="3"
            filter="url(#glow)">

      <animate
        attributeName="r"
        values="16;20;16"
        dur="1.8s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Animated check -->

    <path d="M18,30
             L25,37
             L39,21"

          fill="none"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="30"
          stroke-dashoffset="30">

      <animate
        attributeName="stroke-dashoffset"
        values="30;0;0;30"
        dur="2.5s"
        repeatCount="indefinite"/>

    </path>


    <!-- Floating completion particles -->

    <circle cx="-50"
            cy="-48"
            r="4"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="1.8s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="52"
            cy="-48"
            r="4"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="-53"
            cy="48"
            r="3"
            fill="#D9F2FF">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ========================================= -->
  <!-- TITLE -->
  <!-- ========================================= -->

  <text x="625"
        y="88"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="52"
        font-weight="700"
        letter-spacing=".8"
        fill="url(#title)">

    Final Deliverable

  </text>


  <!-- Animated shine -->

  <rect x="405"
        y="52"
        width="85"
        height="48"
        fill="#FFFFFF"
        opacity=".12">

    <animate
      attributeName="x"
      values="405;845;405"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Divider -->

  <line x1="410"
        y1="117"
        x2="840"
        y2="117"
        stroke="#B9E6FA"
        stroke-width="2"/>


  <circle cx="402"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="848"
          cy="117"
          r="4"
          fill="#D9F2FF">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- SUBTITLE -->

  <text x="625"
        y="153"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="600"
        letter-spacing="1.2"
        fill="#D0EFFB">

    Ready • Validated • Complete

  </text>


  <!-- Bottom data flow -->

  <g transform="translate(625 184)"
     stroke="#B9E6FA"
     stroke-width="2">

    <line x1="-55"
          y1="0"
          x2="55"
          y2="0"
          opacity=".45"/>

    <circle cx="-55" cy="0"
            r="4"
            fill="#B9E6FA"/>

    <circle cx="0" cy="0"
            r="4"
            fill="#B9E6FA"/>

    <circle cx="55" cy="0"
            r="4"
            fill="#B9E6FA"/>


    <!-- Moving completion point -->

    <circle cx="-55"
            cy="0"
            r="5"
            fill="#FFFFFF">

      <animate
        attributeName="cx"
        values="-55;0;55;-55"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
