<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="260"
     viewBox="0 0 1100 260">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#09132f"/>
      <stop offset="100%" stop-color="#160b35"/>
    </linearGradient>

    <!-- ACCENT -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c6cff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <!-- VIOLET -->
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#665cff"/>
      <stop offset="100%" stop-color="#c56cff"/>
    </linearGradient>

    <!-- GLASS -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>

    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- GRID -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#6d82b8"
            stroke-opacity=".09"/>

      <circle cx="0"
              cy="0"
              r="1.3"
              fill="#7890c9"
              opacity=".15"/>

    </pattern>

    <clipPath id="clip">
      <rect x="2"
            y="2"
            width="1096"
            height="256"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1100"
        height="260"
        rx="20"
        fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <rect width="1100"
          height="260"
          fill="url(#grid)"/>


    <!-- AMBIENT GLOW -->

    <circle cx="145"
            cy="130"
            r="100"
            fill="#00d9ff"
            opacity=".07"
            filter="url(#softGlow)"/>

    <circle cx="950"
            cy="130"
            r="110"
            fill="#865cff"
            opacity=".07"
            filter="url(#softGlow)"/>


    <!-- ================================================= -->
    <!-- LEFT FINAL DELIVERABLE ICON -->
    <!-- ================================================= -->

    <g transform="translate(145 130)">

      <!-- Orbit -->

      <circle r="70"
              fill="none"
              stroke="#00e5ff"
              stroke-width="1"
              stroke-dasharray="4 9"
              opacity=".55">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="16s"
          repeatCount="indefinite"/>

      </circle>


      <circle r="55"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".12"/>


      <!-- Main Document -->

      <rect x="-28"
            y="-36"
            width="56"
            height="72"
            rx="8"
            fill="url(#violet)"
            stroke="#bdf7ff"
            stroke-width="2"
            filter="url(#glow)"/>


      <rect x="-20"
            y="-27"
            width="40"
            height="54"
            rx="5"
            fill="#07102d"
            opacity=".9"/>


      <!-- Document Lines -->

      <line x1="-12"
            y1="-15"
            x2="12"
            y2="-15"
            stroke="#00e5ff"
            stroke-width="3"
            stroke-linecap="round"/>

      <line x1="-12"
            y1="-4"
            x2="12"
            y2="-4"
            stroke="#00ffc8"
            stroke-width="3"
            stroke-linecap="round"/>

      <line x1="-12"
            y1="7"
            x2="6"
            y2="7"
            stroke="#ffffff"
            stroke-width="3"
            stroke-linecap="round"/>


      <!-- Check -->

      <path d="M-12 20
               L-5 27
               L12 10"
            fill="none"
            stroke="#00ffc8"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#glow)"/>


      <!-- Orbit Dot -->

      <circle cx="70"
              cy="0"
              r="5"
              fill="#00eaff"
              filter="url(#glow)">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="5s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Spark -->

      <path d="M-52 38
               L-47 48
               L-37 53
               L-47 58
               L-52 68
               L-57 58
               L-67 53
               L-57 48Z"
            fill="#00ffc8"
            filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2s"
                 repeatCount="indefinite"/>

      </path>

    </g>


    <!-- ================================================= -->
    <!-- CENTER CONTENT -->
    <!-- ================================================= -->

    <g transform="translate(285 0)">

      <!-- LABEL -->

      <rect x="10"
            y="23"
            width="205"
            height="28"
            rx="14"
            fill="#ffffff"
            fill-opacity=".04"
            stroke="#00e5ff"
            stroke-opacity=".35"/>


      <circle cx="27"
              cy="37"
              r="4"
              fill="#00ffc8"
              filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="1.5s"
                 repeatCount="indefinite"/>

      </circle>


      <text x="41"
            y="41"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#b9f7ff">

        PROJECT COMPLETION

      </text>


      <!-- TITLE -->

      <text x="12"
            y="112"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="35"
            font-weight="800"
            fill="#00d9ff">

        Part H:

      </text>


      <text x="12"
            y="153"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="34"
            font-weight="800"
            fill="#f7fbff">

        Final Deliverable

      </text>


      <!-- UNDERLINE -->

      <rect x="12"
            y="168"
            width="390"
            height="3"
            rx="2"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;390"
                 dur="1.3s"
                 fill="freeze"/>

      </rect>


      <!-- SUBTITLE -->

      <text x="12"
            y="195"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="9.5"
            letter-spacing="1.9"
            fill="#78a7e8">

        VALIDATE • DOCUMENT • EXPORT • DELIVER

      </text>


      <!-- STATUS -->

      <circle cx="12"
              cy="222"
              r="3.5"
              fill="#00ffc8"
              filter="url(#glow)"/>


      <text x="24"
            y="226"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="9"
            font-weight="600"
            letter-spacing="1.4"
            fill="#67ffe5">

        DATASET READY FOR DELIVERY

      </text>


      <!-- Moving Progress Dot -->

      <line x1="12"
            y1="241"
            x2="390"
            y2="241"
            stroke="#30446f"/>

      <circle cx="12"
              cy="241"
              r="3"
              fill="#ffffff"
              filter="url(#glow)">

        <animate attributeName="cx"
                 values="12;390;12"
                 dur="3.5s"
                 repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================================= -->
    <!-- RIGHT FINAL DELIVERY CARD -->
    <!-- ================================================= -->

    <g transform="translate(790 24)">

      <rect width="285"
            height="212"
            rx="22"
            fill="url(#glass)"
            stroke="#8e7aff"
            stroke-opacity=".3"/>


      <!-- CARD TITLE -->

      <text x="22"
            y="31"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#91b8ff">

        DELIVERY PACKAGE

      </text>


      <!-- PACKAGE ITEMS -->

      <!-- Dataset -->

      <rect x="22"
            y="50"
            width="108"
            height="38"
            rx="9"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#00e5ff"
            stroke-opacity=".35"/>


      <circle cx="42"
              cy="69"
              r="10"
              fill="#00e5ff"
              opacity=".15"/>


      <path d="M36 66H48
               M36 71H48
               M36 76H45"
            stroke="#00e5ff"
            stroke-width="1.8"
            stroke-linecap="round"/>


      <text x="58"
            y="67"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#9eeeff">

        FINAL DATA

      </text>


      <text x="58"
            y="78"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="7"
            fill="#668cc4">

        CLEAN &amp; READY

      </text>


      <!-- Report -->

      <rect x="144"
            y="50"
            width="119"
            height="38"
            rx="9"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#7c6cff"
            stroke-opacity=".4"/>


      <circle cx="164"
              cy="69"
              r="10"
              fill="#7c6cff"
              opacity=".15"/>


      <rect x="158"
            y="63"
            width="12"
            height="13"
            rx="2"
            fill="none"
            stroke="#a99cff"
            stroke-width="1.5"/>


      <line x1="161"
            y1="67"
            x2="167"
            y2="67"
            stroke="#a99cff"/>

      <line x1="161"
            y1="71"
            x2="167"
            y2="71"
            stroke="#a99cff"/>


      <text x="180"
            y="67"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#c5bbff">

        REPORT

      </text>


      <text x="180"
            y="78"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="7"
            fill="#668cc4">

        DOCUMENTED

      </text>


      <!-- Export -->

      <rect x="22"
            y="100"
            width="108"
            height="38"
            rx="9"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#00ffc8"
            stroke-opacity=".35"/>


      <circle cx="42"
              cy="119"
              r="10"
              fill="#00ffc8"
              opacity=".15"/>


      <path d="M42 111V124
               M37 119L42 124L47 119
               M35 127H49"
            fill="none"
            stroke="#00ffc8"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>


      <text x="58"
            y="117"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#8dffe9">

        EXPORT

      </text>


      <text x="58"
            y="128"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="7"
            fill="#668cc4">

        READY

      </text>


      <!-- Verification -->

      <rect x="144"
            y="100"
            width="119"
            height="38"
            rx="9"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#c56cff"
            stroke-opacity=".4"/>


      <circle cx="164"
              cy="119"
              r="10"
              fill="#c56cff"
              opacity=".15"/>


      <path d="M158 119
               L162 123
               L170 114"
            fill="none"
            stroke="#d8c4ff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"/>


      <text x="180"
            y="117"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#d8c4ff">

        VERIFIED

      </text>


      <text x="180"
            y="128"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="7"
            fill="#668cc4">

        QUALITY CHECK

      </text>


      <!-- PROGRESS -->

      <text x="22"
            y="161"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#7fa7dc">

        DELIVERY STATUS

      </text>


      <rect x="22"
            y="171"
            width="240"
            height="7"
            rx="4"
            fill="#26345d"/>


      <rect x="22"
            y="171"
            width="228"
            height="7"
            rx="4"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;228"
                 dur="2s"
                 fill="freeze"/>

      </rect>


      <!-- COMPLETE -->

      <circle cx="22"
              cy="199"
              r="4"
              fill="#00ffc8"
              filter="url(#glow)"/>


      <text x="34"
            y="203"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8.5"
            font-weight="600"
            letter-spacing="1.2"
            fill="#67ffe5">

        COMPLETE &amp; READY

      </text>


      <!-- Floating Dot -->

      <circle cx="260"
              cy="45"
              r="2"
              fill="#7eeaff">

        <animate attributeName="cy"
                 values="45;62;45"
                 dur="3s"
                 repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================================= -->
    <!-- MOVING SCANNER -->
    <!-- ================================================= -->

    <rect x="265"
          y="10"
          width="2"
          height="240"
          fill="url(#accent)"
          opacity=".12">

      <animate attributeName="x"
               values="260;785;260"
               dur="7s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ================================================= -->
  <!-- BORDER -->
  <!-- ================================================= -->

  <rect x="1.5"
        y="1.5"
        width="1097"
        height="257"
        rx="19"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-opacity=".5"/>

</svg>
