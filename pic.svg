<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="260"
     viewBox="0 0 1100 260">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#09132f"/>
      <stop offset="100%" stop-color="#160b35"/>
    </linearGradient>

    <!-- Main Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c6cff"/>
      <stop offset="100%" stop-color="#00ffc8"/>
    </linearGradient>

    <!-- Violet -->
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#665cff"/>
      <stop offset="100%" stop-color="#c56cff"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path d="M40 0H0V40"
            fill="none"
            stroke="#6d82b8"
            stroke-opacity=".09"/>

      <circle cx="0"
              cy="0"
              r="1.4"
              fill="#7890c9"
              opacity=".15"/>

    </pattern>

    <clipPath id="clip">
      <rect x="2"
            y="2"
            width="1096"
            height="256"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1100"
        height="260"
        rx="20"
        fill="url(#bg)"/>

  <g clip-path="url(#clip)">

    <rect width="1100"
          height="260"
          fill="url(#grid)"/>


    <!-- Ambient Glow -->

    <circle cx="145"
            cy="130"
            r="100"
            fill="#00d9ff"
            opacity=".07"
            filter="url(#softGlow)"/>

    <circle cx="950"
            cy="130"
            r="110"
            fill="#865cff"
            opacity=".07"
            filter="url(#softGlow)"/>


    <!-- ================================================= -->
    <!-- LEFT FEATURE ICON -->
    <!-- ================================================= -->

    <g transform="translate(145 130)">

      <!-- Orbit -->

      <circle r="70"
              fill="none"
              stroke="#00e5ff"
              stroke-width="1"
              stroke-dasharray="4 9"
              opacity=".55">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="16s"
          repeatCount="indefinite"/>

      </circle>


      <circle r="55"
              fill="none"
              stroke="#ffffff"
              stroke-opacity=".12"/>


      <!-- Main Circle -->

      <circle r="36"
              fill="url(#violet)"
              stroke="#bdf7ff"
              stroke-width="2"
              filter="url(#glow)"/>


      <circle r="25"
              fill="#07102d"
              opacity=".82"/>


      <!-- Network -->

      <path d="M0 -14
               L-14 10
               H14
               Z"
            fill="none"
            stroke="#00e5ff"
            stroke-width="2.5"/>


      <circle cx="0"
              cy="-14"
              r="4"
              fill="#00e5ff"/>

      <circle cx="-14"
              cy="10"
              r="4"
              fill="#00ffc8"/>

      <circle cx="14"
              cy="10"
              r="4"
              fill="#ffffff"/>


      <!-- Orbiting Dot -->

      <circle cx="70"
              cy="0"
              r="5"
              fill="#00eaff"
              filter="url(#glow)">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="5s"
          repeatCount="indefinite"/>

      </circle>


      <!-- Spark -->

      <path d="M-52 38
               L-47 48
               L-37 53
               L-47 58
               L-52 68
               L-57 58
               L-67 53
               L-57 48Z"
            fill="#00ffc8"
            filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2s"
                 repeatCount="indefinite"/>

      </path>

    </g>


    <!-- ================================================= -->
    <!-- CENTER CONTENT -->
    <!-- IMPORTANT: RIGHT CARD STARTS AT X = 790 -->
    <!-- CENTER CONTENT ENDS BEFORE X = 700 -->
    <!-- ================================================= -->

    <g transform="translate(285 0)">

      <!-- Label -->

      <rect x="10"
            y="23"
            width="185"
            height="28"
            rx="14"
            fill="#ffffff"
            fill-opacity=".04"
            stroke="#00e5ff"
            stroke-opacity=".35"/>


      <circle cx="27"
              cy="37"
              r="4"
              fill="#00ffc8"
              filter="url(#glow)">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="1.5s"
                 repeatCount="indefinite"/>

      </circle>


      <text x="41"
            y="41"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#b9f7ff">

        FEATURE PIPELINE

      </text>


      <!-- ================= TITLE ================= -->

      <text x="12"
            y="101"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="35"
            font-weight="800"
            fill="#00d9ff">

        Part E:

      </text>


      <text x="12"
            y="143"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="31"
            font-weight="800"
            fill="#f7fbff">

        Feature Engineering

      </text>


      <!-- Underline -->

      <rect x="12"
            y="157"
            width="390"
            height="3"
            rx="2"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;390"
                 dur="1.3s"
                 fill="freeze"/>

      </rect>


      <!-- Pipeline -->

      <text x="12"
            y="184"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            letter-spacing="2.1"
            fill="#78a7e8">

        CREATE • SELECT • TRANSFORM • IMPROVE

      </text>


      <!-- Line -->

      <line x1="12"
            y1="207"
            x2="390"
            y2="207"
            stroke="#30446f"/>


      <!-- Moving Dot -->

      <circle cx="12"
              cy="207"
              r="3.5"
              fill="#ffffff"
              filter="url(#glow)">

        <animate attributeName="cx"
                 values="12;390;12"
                 dur="3.5s"
                 repeatCount="indefinite"/>

      </circle>


      <!-- Status -->

      <circle cx="12"
              cy="229"
              r="3.5"
              fill="#00ffc8"
              filter="url(#glow)"/>


      <text x="24"
            y="233"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="9"
            font-weight="600"
            letter-spacing="1.5"
            fill="#67ffe5">

        FEATURES READY FOR MODELING

      </text>

    </g>


    <!-- ================================================= -->
    <!-- RIGHT FEATURE ENGINE CARD -->
    <!-- ================================================= -->

    <g transform="translate(790 24)">

      <!-- Card -->

      <rect width="285"
            height="212"
            rx="22"
            fill="#ffffff"
            fill-opacity=".035"
            stroke="#8e7aff"
            stroke-opacity=".3"/>


      <!-- Card Title -->

      <text x="22"
            y="31"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="2"
            fill="#91b8ff">

        FEATURE ENGINE

      </text>


      <!-- Raw Features -->

      <text x="22"
            y="57"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#7fa7dc">

        RAW FEATURES

      </text>


      <!-- X1 -->

      <rect x="22"
            y="67"
            width="76"
            height="31"
            rx="8"
            fill="#ffffff"
            fill-opacity=".04"
            stroke="#00e5ff"
            stroke-opacity=".55"/>


      <text x="60"
            y="88"
            text-anchor="middle"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="12"
            fill="#00e5ff">

        X₁

      </text>


      <!-- X2 -->

      <rect x="22"
            y="108"
            width="76"
            height="31"
            rx="8"
            fill="#ffffff"
            fill-opacity=".04"
            stroke="#7c6cff"
            stroke-opacity=".55"/>


      <text x="60"
            y="129"
            text-anchor="middle"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="12"
            fill="#b79cff">

        X₂

      </text>


      <!-- Connections -->

      <path d="M98 82
               H128
               V94
               H142"
            fill="none"
            stroke="#00e5ff"
            stroke-width="2"
            stroke-dasharray="5 5"/>


      <path d="M98 124
               H128
               V108
               H142"
            fill="none"
            stroke="#9a7cff"
            stroke-width="2"
            stroke-dasharray="5 5"/>


      <!-- Transformation -->

      <circle cx="165"
              cy="101"
              r="30"
              fill="url(#violet)"
              filter="url(#glow)"/>


      <circle cx="165"
              cy="101"
              r="21"
              fill="#09132f"/>


      <path d="M165 81
               L171 91
               H181
               L176 101
               L181 111
               H171
               L165 121
               L159 111
               H149
               L154 101
               L149 91
               H159Z"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"/>


      <!-- NEW FEATURE -->

      <path d="M195 101
               H242"
            stroke="#00ffc8"
            stroke-width="2"/>


      <circle cx="249"
              cy="101"
              r="7"
              fill="#00ffc8"
              filter="url(#glow)">

        <animate attributeName="r"
                 values="5;8;5"
                 dur="1.7s"
                 repeatCount="indefinite"/>

      </circle>


      <text x="211"
            y="84"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            letter-spacing="1"
            fill="#7fa7dc">

        NEW

      </text>


      <!-- Feature Quality -->

      <text x="22"
            y="164"
            font-family="Segoe UI, Arial, sans-serif"
            font-size="8"
            fill="#7fa7dc">

        FEATURE QUALITY

      </text>


      <rect x="22"
            y="174"
            width="240"
            height="7"
            rx="4"
            fill="#26345d"/>


      <rect x="22"
            y="174"
            width="190"
            height="7"
            rx="4"
            fill="url(#accent)">

        <animate attributeName="width"
                 values="0;190"
                 dur="1.8s"
                 fill="freeze"/>

      </rect>


      <!-- Floating Dot -->

      <circle cx="258"
              cy="45"
              r="2"
              fill="#7eeaff">

        <animate attributeName="cy"
                 values="45;62;45"
                 dur="3s"
                 repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================================= -->
    <!-- MOVING SCANNER -->
    <!-- ================================================= -->

    <rect x="265"
          y="10"
          width="2"
          height="240"
          fill="url(#accent)"
          opacity=".12">

      <animate attributeName="x"
               values="260;785;260"
               dur="7s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ================================================= -->
  <!-- BORDER -->
  <!-- ================================================= -->

  <rect x="1.5"
        y="1.5"
        width="1097"
        height="257"
        rx="19"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-opacity=".5"/>

</svg>
