<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="220" viewBox="0 0 1100 220">

<defs>

  <!-- SAME REFERENCE BLUE THEME -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#0F2C4C"/>
    <stop offset="25%"  stop-color="#1F5C8B"/>
    <stop offset="50%"  stop-color="#2D86C0"/>
    <stop offset="75%"  stop-color="#1F5C8B"/>
    <stop offset="100%" stop-color="#2D86C0"/>
  </linearGradient>

  <linearGradient id="title" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="50%" stop-color="#D9F2FF"/>
    <stop offset="100%" stop-color="#FFFFFF"/>
  </linearGradient>

  <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2D86C0"/>
    <stop offset="100%" stop-color="#0F2C4C"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- BACKGROUND -->
<rect width="1100" height="220" rx="12" fill="url(#bg)"/>


<!-- Subtle reference-style bands -->
<g opacity=".10" fill="#FFFFFF">
  <rect x="0" y="18" width="1100" height="3"/>
  <rect x="0" y="50" width="1100" height="3"/>
  <rect x="0" y="168" width="1100" height="3"/>
  <rect x="0" y="199" width="1100" height="3"/>
</g>


<!-- ================================================= -->
<!-- DATA UNDERSTANDING + CLEANING ICON -->
<!-- ================================================= -->

<g transform="translate(115 108)">


  <!-- Rotating analysis ring -->

  <circle r="58"
          fill="none"
          stroke="#B9E6FA"
          stroke-width="2"
          stroke-dasharray="8 8"
          opacity=".7">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="12s"
      repeatCount="indefinite"/>

  </circle>


  <!-- DATABASE -->

  <g transform="translate(-20 4)"
     fill="url(#icon)"
     stroke="#C7ECFA"
     stroke-width="2">

    <ellipse cx="0" cy="-27"
             rx="29" ry="10"/>

    <path d="M-29,-27
             V18
             C-29,31 29,31 29,18
             V-27"/>

    <ellipse cx="0" cy="-5"
             rx="29" ry="9"
             fill="none"/>

    <ellipse cx="0" cy="15"
             rx="29" ry="9"
             fill="none"/>

  </g>


  <!-- Magnifying Glass -->

  <g transform="translate(24 -10)"
     filter="url(#glow)">

    <circle cx="0"
            cy="0"
            r="25"
            fill="#123C60"
            stroke="#D9F2FF"
            stroke-width="4"/>

    <line x1="18"
          y1="18"
          x2="38"
          y2="38"
          stroke="#D9F2FF"
          stroke-width="6"
          stroke-linecap="round"/>

    <!-- Scan animation -->

    <line x1="-15"
          y1="-3"
          x2="15"
          y2="-3"
          stroke="#67C9EA"
          stroke-width="3"
          stroke-linecap="round">

      <animate
        attributeName="y1"
        values="-12;12;-12"
        dur="2s"
        repeatCount="indefinite"/>

      <animate
        attributeName="y2"
        values="-12;12;-12"
        dur="2s"
        repeatCount="indefinite"/>

    </line>

  </g>


  <!-- CLEANING CHECK -->

  <g transform="translate(40 35)">

    <circle r="16"
            fill="#2D86C0"
            stroke="#D9F2FF"
            stroke-width="2">

      <animate
        attributeName="r"
        values="14;18;14"
        dur="1.8s"
        repeatCount="indefinite"/>

    </circle>

    <path d="M-8,0 L-2,6 L10,-7"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="25"
          stroke-dashoffset="25">

      <animate
        attributeName="stroke-dashoffset"
        values="25;0;0;25"
        dur="2.5s"
        repeatCount="indefinite"/>

    </path>

  </g>


  <!-- Data particles -->

  <g fill="#D9F2FF">

    <circle cx="-52" cy="-48" r="4">
      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="1.5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="52" cy="-48" r="4">
      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="1.8s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="-52" cy="48" r="4">
      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

  </g>

</g>


<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<text x="625"
      y="88"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="46"
      font-weight="700"
      letter-spacing=".5"
      fill="url(#title)">

  Data Understanding &amp; Cleaning

</text>


<!-- Moving highlight -->

<rect x="350"
      y="52"
      width="85"
      height="48"
      fill="#FFFFFF"
      opacity=".12">

  <animate
    attributeName="x"
    values="350;875;350"
    dur="3.5s"
    repeatCount="indefinite"/>

</rect>


<!-- Divider -->

<line x1="390"
      y1="117"
      x2="860"
      y2="117"
      stroke="#B9E6FA"
      stroke-width="2"/>

<circle cx="382"
        cy="117"
        r="4"
        fill="#D9F2FF"/>

<circle cx="868"
        cy="117"
        r="4"
        fill="#D9F2FF"/>


<!-- SUBTITLE -->

<text x="625"
      y="153"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="25"
      font-weight="600"
      letter-spacing="1.2"
      fill="#D0EFFB">

  Explore • Detect • Clean

</text>


<!-- Bottom data flow -->

<g transform="translate(625 184)"
   stroke="#B9E6FA"
   stroke-width="2">

  <line x1="-55"
        y1="0"
        x2="55"
        y2="0"
        opacity=".45"/>

  <circle cx="-55" cy="0" r="4" fill="#B9E6FA"/>
  <circle cx="0" cy="0" r="4" fill="#B9E6FA"/>
  <circle cx="55" cy="0" r="4" fill="#B9E6FA"/>

  <!-- Moving cleaning/data point -->

  <circle cx="-55"
          cy="0"
          r="5"
          fill="#FFFFFF">

    <animate
      attributeName="cx"
      values="-55;0;55;-55"
      dur="2.5s"
      repeatCount="indefinite"/>

  </circle>

</g>

</svg>
