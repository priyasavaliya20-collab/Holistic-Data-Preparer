<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="220" viewBox="0 0 1100 220">

  <defs>

    <!-- SAME BLUE THEME -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0F2C4C"/>
      <stop offset="25%"  stop-color="#1F5C8B"/>
      <stop offset="50%"  stop-color="#2D86C0"/>
      <stop offset="75%"  stop-color="#1F5C8B"/>
      <stop offset="100%" stop-color="#2D86C0"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D9F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="database" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D86C0"/>
      <stop offset="100%" stop-color="#0F2C4C"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->
  <rect width="1100" height="220" rx="12" fill="url(#bg)"/>

  <!-- Subtle theme lines -->
  <g opacity=".10" stroke="#FFFFFF">
    <line x1="0" y1="20" x2="1100" y2="20"/>
    <line x1="0" y1="52" x2="1100" y2="52"/>
    <line x1="0" y1="168" x2="1100" y2="168"/>
    <line x1="0" y1="200" x2="1100" y2="200"/>
  </g>


  <!-- ================= DATA ACQUISITION + MERGING ICON ================= -->

  <g transform="translate(115 108)">

    <!-- Outer rotating ring -->
    <circle r="58"
            fill="none"
            stroke="#B9E6FA"
            stroke-width="2"
            stroke-dasharray="8 8"
            opacity=".7">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"/>
    </circle>


    <!-- LEFT DATABASE -->

    <g transform="translate(-32 0)"
       fill="url(#database)"
       stroke="#C7ECFA"
       stroke-width="2">

      <ellipse cx="0" cy="-22"
               rx="25" ry="9"/>

      <path d="M-25,-22 V17
               C-25,29 25,29 25,17
               V-22"/>

      <ellipse cx="0" cy="-5"
               rx="25" ry="9"
               fill="none"/>

      <ellipse cx="0" cy="12"
               rx="25" ry="9"
               fill="none"/>

    </g>


    <!-- RIGHT DATABASE -->

    <g transform="translate(32 0)"
       fill="url(#database)"
       stroke="#C7ECFA"
       stroke-width="2">

      <ellipse cx="0" cy="-22"
               rx="25" ry="9"/>

      <path d="M-25,-22 V17
               C-25,29 25,29 25,17
               V-22"/>

      <ellipse cx="0" cy="-5"
               rx="25" ry="9"
               fill="none"/>

      <ellipse cx="0" cy="12"
               rx="25" ry="9"
               fill="none"/>

    </g>


    <!-- MERGING ARROWS -->

    <path d="M-58,-8
             C-45,-25 -25,-28 -10,-14"
          fill="none"
          stroke="#D9F2FF"
          stroke-width="3"
          stroke-linecap="round"/>

    <path d="M58,-8
             C45,-25 25,-28 10,-14"
          fill="none"
          stroke="#D9F2FF"
          stroke-width="3"
          stroke-linecap="round"/>


    <!-- Center merge node -->

    <circle cx="0"
            cy="-5"
            r="11"
            fill="#2D86C0"
            stroke="#FFFFFF"
            stroke-width="2"
            filter="url(#glow)">

      <animate
        attributeName="r"
        values="9;13;9"
        dur="1.8s"
        repeatCount="indefinite"/>
    </circle>


    <!-- Moving data particles -->

    <circle r="4" fill="#FFFFFF">

      <animateMotion
        path="M-58,-8 C-45,-25 -25,-28 -10,-14"
        dur="1.8s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="4" fill="#B9E6FA">

      <animateMotion
        path="M58,-8 C45,-25 25,-28 10,-14"
        dur="1.8s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Merged output -->

    <path d="M0,7 V48"
          stroke="#D9F2FF"
          stroke-width="3"
          stroke-dasharray="6 5"/>

    <circle cx="0" cy="50"
            r="6"
            fill="#FFFFFF">

      <animate
        attributeName="cy"
        values="48;55;48"
        dur="1.5s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================= TITLE ================= -->

  <text x="625"
        y="88"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="46"
        font-weight="700"
        letter-spacing=".5"
        fill="url(#title)">

    Data Acquisition &amp; Merging

  </text>


  <!-- Animated shine -->
  <rect x="350"
        y="52"
        width="85"
        height="48"
        fill="#FFFFFF"
        opacity=".12">

    <animate
      attributeName="x"
      values="350;870;350"
      dur="3.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Divider -->
  <line x1="390" y1="117"
        x2="860" y2="117"
        stroke="#B9E6FA"
        stroke-width="2"
        opacity=".8"/>

  <circle cx="382" cy="117"
          r="4"
          fill="#D9F2FF"/>

  <circle cx="868" cy="117"
          r="4"
          fill="#D9F2FF"/>


  <!-- SUBTITLE -->

  <text x="625"
        y="153"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="600"
        letter-spacing="1.2"
        fill="#D0EFFB">

    Collect • Combine • Integrate

  </text>


  <!-- Bottom data flow -->

  <g transform="translate(625 184)"
     stroke="#B9E6FA"
     stroke-width="2">

    <line x1="-55" y1="0"
          x2="55" y2="0"
          opacity=".45"/>

    <circle cx="-55" cy="0" r="4" fill="#B9E6FA"/>
    <circle cx="0" cy="0" r="4" fill="#B9E6FA"/>
    <circle cx="55" cy="0" r="4" fill="#B9E6FA"/>

    <circle cx="-55" cy="0"
            r="5"
            fill="#FFFFFF">

      <animate
        attributeName="cx"
        values="-55;0;55;-55"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
